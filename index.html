function wireCandidatesDrawer(mode){
  const mount = document.getElementById('scope-content');
  if(!mount) return;
  const drawer = mount.querySelector('#candidates-drawer');
  if(!drawer) return;

  mount.querySelector('#cd-toggle').onclick = ()=>{
    candidatesDrawerOpen = !candidatesDrawerOpen;
    renderCalendarPanel(mode);
  };
  mount.querySelector('#cd-add').onclick = ()=> openCandidateModal(null);

  mount.querySelectorAll('.cc-join').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const c = candidates.find(x=>x.id===btn.dataset.cid);
      if(!c) return;
      await toggleCandJoin(c);
      renderCalendarPanel(mode);
    };
  });
  mount.querySelectorAll('.cc-place').forEach(btn=>{
    btn.onclick = ()=>{
      const c = candidates.find(x=>x.id===btn.dataset.cid);
      if(!c) return;
      openItemModal(null, {forceScope: mode==='personal' ? 'personal' : 'group', prefillCandidate: c});
    };
  });

  mount.querySelectorAll('.candidate-chip').forEach(chip=>{
    chip.addEventListener('click', (e)=>{
      if(e.target.closest('button,a')) return;
      const c = candidates.find(x=>x.id===chip.dataset.cid); if(c) openCandidateModal(c);
    });
  });
  mount.querySelectorAll('.cc-edit').forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); const c = candidates.find(x=>x.id===btn.dataset.cid); if(c) openCandidateModal(c); };
  });
  mount.querySelectorAll('.cc-del').forEach(btn=>{
    btn.onclick = async (e)=>{ e.stopPropagation(); if(await deleteCandidate(btn.dataset.cid)) renderApp(); };
  });

  if(mode==='compare') return; // no drag-to-place on the read-only comparison board

  mount.querySelectorAll('.candidate-chip').forEach(chip=>{
    chip.addEventListener('dragstart', (e)=>{
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('application/x-candidate', chip.dataset.cid);
    });
    chip.addEventListener('dragend', ()=> chip.classList.remove('dragging'));
  });
}

function wireCalendarInteractions(mode){
  const mount = document.getElementById('scope-content');
  if(!mount) return;
  wireLongPress(mount);
  mount.querySelectorAll('[data-adjopen]').forEach(b=>{ b.addEventListener('click', (e)=>{ e.stopPropagation(); adjustKey = b.dataset.adjopen; renderCalendarPanel(scope); paintAdjust(); }); b.addEventListener('mousedown', e=>e.stopPropagation()); });

  // click to open edit/view
  mount.querySelectorAll('.item-card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('[data-joinkey]')) return;
      if(e.target.closest('.resize-handle')) return;
      if(Date.now() < adjSuppressUntil) return;
      const cfg = cardRegistry[card.dataset.key];
      if(!cfg) return;
      if(cfg.editable){
        const list = cfg.sourceType==='group' ? groupItems : personalItems;
        const it = list.find(x=>x.id===cfg.id);
        if(it) openItemModal(it, {forceScope: cfg.sourceType});
      } else {
        openViewModal(cfg);
      }
    });
  });

  // join / leave buttons
  mount.querySelectorAll('[data-joinkey]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const cfg = cardRegistry[btn.dataset.joinkey];
      if(!cfg) return;
      const it = groupItems.find(x=>x.id===cfg.groupId);
      if(!it) return;
      it.participants = it.participants || [];
      const i = it.participants.indexOf(myName);
      if(i>=0) it.participants.splice(i,1); else it.participants.push(myName);
      await sset('group-items', groupItems, true);
      renderApp();
    });
  });


  mount.querySelectorAll('.item-card[draggable="true"]').forEach(card=>{
    card.addEventListener('dragstart', (e)=>{
      const cfg = cardRegistry[card.dataset.key];
      if(!cfg) return;
      const _r = card.getBoundingClientRect();
      dragCtx = { key: cfg.key, offX: e.clientX-_r.left, offY: e.clientY-_r.top };
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', cfg.key);
    });
    card.addEventListener('dragend', ()=>{
      card.classList.remove('dragging');
      clearGhost();
      dragCtx = null;
    });
  });

  mount.querySelectorAll('.day-body').forEach(col=>{
    col.addEventListener('dragover', (e)=>{
      e.preventDefault(); col.classList.add('drag-over');
      const cfg = dragCtx ? cardRegistry[dragCtx.key] : null;
      const mins = slotFromPoint(col, e.clientX, e.clientY, dragCtx&&dragCtx.offX, dragCtx&&dragCtx.offY);
      showGhost(col, mins, cfg ? (+cfg.duration||60) : 60);
    });
    col.addEventListener('dragleave', (e)=>{ if(!col.contains(e.relatedTarget)){ col.classList.remove('drag-over'); const g = col.querySelector('.drop-ghost'); if(g) g.remove(); col.classList.remove('drop-on'); } });
    col.addEventListener('drop', async (e)=>{
      e.preventDefault();
      col.classList.remove('drag-over');
      let mins = slotFromPoint(col, e.clientX, e.clientY, dragCtx&&dragCtx.offX, dragCtx&&dragCtx.offY);
      clearGhost();
      const newDate = col.dataset.date;
      const newTime = minsToLabel(mins);

      const cid = e.dataTransfer.getData('application/x-candidate');
      if(cid){
        const c = candidates.find(x=>x.id===cid);
        if(c) openItemModal(null, { forceScope: mode==='personal' ? 'personal':'group', prefillCandidate:c, presetDate:newDate, presetTime:newTime });
        return;
      }
      const key = e.dataTransfer.getData('text/plain');
      const cfg = cardRegistry[key];
      if(!cfg || !cfg.editable) return;
      await moveItem(cfg, newDate, newTime);
    });
  });
}


/* ---------------- v4: 拖動時顯示落點（目標格） ---------------- */
function slotFromPoint(col, cx, cy, offX, offY){
  const rect = col.getBoundingClientRect();
  let mins;
  if(layout==='rows'){
    let x = (cx - (offX||0)) - rect.left; x = Math.max(0, Math.min(x, rect.width-10));
    mins = START_HOUR*60 + Math.round((x/ROWW*60)/15)*15;
  } else {
    let y = (cy - (offY||0)) - rect.top; y = Math.max(0, Math.min(y, rect.height-10));
    mins = START_HOUR*60 + Math.round((y/ROW_H*60)/15)*15;
  }
  return Math.max(START_HOUR*60, Math.min(mins, END_HOUR*60-15));
}
function clearGhost(){ document.querySelectorAll('.drop-line').forEach(g=>g.remove()); document.querySelectorAll('.drop-ghost').forEach(g=>g.remove()); document.querySelectorAll('.day-body.drop-on').forEach(c=>c.classList.remove('drop-on')); }
function showGhost(col, mins, dur){
  let g = col.querySelector('.drop-ghost');
  if(!g){ clearGhost(); g = document.createElement('div'); g.className = 'drop-ghost'; col.appendChild(g); col.classList.add('drop-on'); }
  const st = minsToLabel(mins), d = parseDate(col.dataset.date);
  g.innerHTML = `<b>${st}–${endTimeStr(st, dur)}</b><small>${d.getMonth()+1}/${d.getDate()}</small>`;
  let ln = col.querySelector('.drop-line');
  if(!ln){ ln = document.createElement('div'); ln.className = 'drop-line'; col.appendChild(ln); }
  ln.innerHTML = `<span>${st}</span>`;
  ln.className = 'drop-line' + (layout==='rows' ? ' v' : '');
  if(layout==='rows') ln.style.cssText = `left:${(mins-START_HOUR*60)/60*ROWW}px;`;
  else ln.style.cssText = `top:${(mins-START_HOUR*60)/60*ROW_H}px;`;
  if(layout==='rows'){ g.style.cssText = `left:${(mins-START_HOUR*60)/60*ROWW}px; width:${Math.max(44,dur/60*ROWW-3)}px; top:4%; height:92%;`; }
  else { g.style.cssText = `top:${(mins-START_HOUR*60)/60*ROW_H}px; height:${Math.max(28,dur/60*ROW_H-3)}px; left:2%; width:96%;`; }
}

/* ---------------- v4: 長按行程框 → 調整時間（手機專用，有大掣 + 即時顯示） ---------------- */
let adjustKey = null, adjSuppressUntil = 0, adjSaveT = null;
function adjItem(cfg){ const list = cfg.sourceType==='group' ? groupItems : personalItems; return list.find(x=>x.id===cfg.id); }
function adjSave(cfg){
  clearTimeout(adjSaveT);
  adjSaveT = setTimeout(async ()=>{
    try{
      if(cfg.sourceType==='group') await sset('group-items', groupItems, true);
      else { await sset('personal-items', personalItems, false); await syncPublicPersonal(); }
    }catch(e){}
  }, 700);
}
function syncAdjust(){
  const sh = document.getElementById('adj-sheet');
  if(!sh) return;
  if(!adjustKey || !cardRegistry[adjustKey] || !(scope==='personal'||scope==='group')){ sh.remove(); adjustKey = null; document.body.classList.remove('has-adj'); }
}
function closeAdjust(){
  adjustKey = null;
  const sh = document.getElementById('adj-sheet'); if(sh) sh.remove();
  document.body.classList.remove('has-adj');
  renderCalendarPanel(scope);
}
function durLabel(m){ const h = Math.floor(m/60), r = m%60; return (h? h+'小時':'') + (r? (h?' ':'')+r+'分':''); }
function paintAdjust(){
  const cfg = cardRegistry[adjustKey]; if(!cfg){ syncAdjust(); return; }
  const it = adjItem(cfg); if(!it) return;
  let sh = document.getElementById('adj-sheet');
  if(!sh){ sh = document.createElement('div'); sh.id = 'adj-sheet'; document.body.appendChild(sh); sh.addEventListener('click', onAdjClick); }
  const d = parseDate(it.date);
  document.body.classList.add('has-adj');
  sh.innerHTML = `
    <div class="adj-top"><div class="adj-title">${escapeHtml(it.title||'')}</div><button type="button" class="adj-done" data-act="done">完成</button></div>
    <div class="adj-big">${it.time}–${endTimeStr(it.time, it.duration)}</div>
    <div class="adj-sub">DAY ${tripDates().indexOf(it.date)+1} · ${d.getMonth()+1}/${d.getDate()} · 共 ${durLabel(it.duration)}</div>
    <div class="adj-row"><span>開始</span><button data-act="s-30">−30</button><button data-act="s-15">−15</button><button data-act="s+15">+15</button><button data-act="s+30">+30</button></div>
    <div class="adj-row"><span>長度</span><button data-act="d-30">−30</button><button data-act="d-15">−15</button><button data-act="d+15">+15</button><button data-act="d+30">+30</button></div>
    <div class="adj-row"><span>日子</span><button data-act="day-1" class="wide">◀ 前一日</button><button data-act="day+1" class="wide">後一日 ▶</button></div>
    <div class="adj-hint">掣以「分鐘」計；亦可以長按後直接拖去新位置</div>`;
  const el = document.querySelector('.item-card[data-key="'+adjustKey+'"]');
  if(el){ el.style.scrollMarginBottom = '260px'; try{ el.scrollIntoView({block:'nearest', inline:'nearest'}); }catch(e){} }
}
function onAdjClick(e){
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act==='done'){ closeAdjust(); return; }
  const cfg = cardRegistry[adjustKey]; if(!cfg) return;
  const it = adjItem(cfg); if(!it) return;
  const MIN = START_HOUR*60, MAX = END_HOUR*60;
  let st = timeToMins(it.time), du = +it.duration||60;
  const n = parseInt(act.slice(2),10);
  if(act[0]==='s') st = Math.max(MIN, Math.min(st+n, MAX-15));
  else if(act[0]==='d') du = Math.max(15, Math.min(du+n, MAX-st));
  else if(act.startsWith('day')){
    const ds = tripDates(); const i = ds.indexOf(it.date)+(act==='day+1'?1:-1);
    if(i<0 || i>=ds.length) return; it.date = ds[i];
  }
  it.time = minsToLabel(st); it.duration = du;
  renderCalendarPanel(scope); paintAdjust(); adjSave(cfg);
}
function wireLongPress(mount){
  mount.querySelectorAll('.item-card[data-editable="1"]').forEach(card=>{
    let lp = null;
    const bubble = ()=>{ let b = document.querySelector('.resize-bubble.mv'); if(!b){ b = document.createElement('div'); b.className = 'resize-bubble mv'; document.body.appendChild(b); } return b; };
    const clearB = ()=>{ document.querySelectorAll('.resize-bubble.mv').forEach(b=>b.remove()); };
    card.addEventListener('touchstart', (e)=>{
      if(e.touches.length!==1 || e.target.closest('.resize-handle,[data-joinkey]')) return;
      const t = e.touches[0], r = card.getBoundingClientRect();
      lp = { x:t.clientX, y:t.clientY, offX:t.clientX-r.left, offY:t.clientY-r.top, fired:false, moved:false, target:null };
      lp.timer = setTimeout(()=>{
        if(!lp) return;
        lp.fired = true;
        try{ navigator.vibrate && navigator.vibrate(18); }catch(_){}
        adjustKey = card.dataset.key;
        mount.querySelectorAll('.item-card.adjusting').forEach(c=>c.classList.remove('adjusting'));
        card.classList.add('adjusting');
        paintAdjust();
      }, 380);
    }, {passive:true});
    card.addEventListener('touchmove', (e)=>{
      if(!lp) return;
      const t = e.touches[0];
      if(!lp.fired){
        if(Math.hypot(t.clientX-lp.x, t.clientY-lp.y) > 8){ clearTimeout(lp.timer); lp = null; }
        return;
      }
      e.preventDefault();
      const dx = t.clientX-lp.x, dy = t.clientY-lp.y;
      if(!lp.moved && Math.hypot(dx,dy) < 6) return;
      lp.moved = true;
      card.style.transform = `translate(${dx}px,${dy}px)`; card.style.zIndex = 50; card.style.pointerEvents = 'none';
      const horiz = layout==='rows';
      const probe = document.elementFromPoint(t.clientX, t.clientY);
      const col = probe && probe.closest ? probe.closest('.day-body') : null;
      const b = bubble();
      if(!col){ lp.target = null; clearGhost(); b.textContent = '放喺日程格入面'; }
      else{
        const rect = col.getBoundingClientRect();
        let mins;
        if(horiz){ let x = (t.clientX-lp.offX) - rect.left; x = Math.max(0, Math.min(x, rect.width-10)); mins = START_HOUR*60 + Math.round((x/ROWW*60)/15)*15; }
        else { let y = (t.clientY-lp.offY) - rect.top; y = Math.max(0, Math.min(y, rect.height-10)); mins = START_HOUR*60 + Math.round((y/ROW_H*60)/15)*15; }
        mins = Math.max(START_HOUR*60, Math.min(mins, END_HOUR*60-15));
        const cfg = cardRegistry[card.dataset.key];
        const dd = parseDate(col.dataset.date);
        lp.target = { date: col.dataset.date, time: minsToLabel(mins) };
        showGhost(col, mins, +cfg.duration||60);
        b.textContent = `${dd.getMonth()+1}/${dd.getDate()}　${minsToLabel(mins)}–${endTimeStr(minsToLabel(mins), cfg.duration)}`;
      }
      b.style.left = Math.min(Math.max(8, t.clientX-80), window.innerWidth-190)+'px';
      b.style.top = Math.max(8, t.clientY-90)+'px';
    }, {passive:false});
    const end = (e)=>{
      if(!lp) return;
      clearTimeout(lp.timer);
      const cur = lp; lp = null;
      if(!cur.fired) return;
      adjSuppressUntil = Date.now()+500;
      if(e && e.cancelable) e.preventDefault();
      clearB(); clearGhost();
      card.style.transform=''; card.style.zIndex=''; card.style.pointerEvents='';
      if(cur.moved && cur.target){
        const cfg = cardRegistry[card.dataset.key];
        const it = cfg && adjItem(cfg);
        if(it){ it.date = cur.target.date; it.time = cur.target.time; renderCalendarPanel(scope); paintAdjust(); adjSave(cfg); }
      }
    };

    // 電腦：自訂滑鼠拖動（唔靠瀏覽器原生拖放），拖動時顯示時間線 + 落點格
    card.setAttribute('draggable','false');
    card.addEventListener('mousedown', (e)=>{
      if(e.button!==0 || e.target.closest('.resize-handle,[data-joinkey],[data-adjopen]')) return;
      const r = card.getBoundingClientRect();
      const m = { x:e.clientX, y:e.clientY, offX:e.clientX-r.left, offY:e.clientY-r.top, moved:false, target:null, cx:e.clientX, cy:e.clientY };
      let timer = null;
      const cfg0 = ()=> cardRegistry[card.dataset.key];
      const upd = ()=>{
        const horiz = layout==='rows';
        card.style.transform = `translate(${m.cx-m.x}px,${m.cy-m.y}px)`;
        const probe = document.elementFromPoint(m.cx, m.cy);
        const col = probe && probe.closest ? probe.closest('.day-body') : null;
        const b = bubble();
        if(!col){ m.target = null; b.textContent = '放入日程格'; clearGhost(); }
        else{
          const mins = slotFromPoint(col, m.cx, m.cy, m.offX, m.offY);
          const cfg = cfg0(); const dd = parseDate(col.dataset.date);
          m.target = { date: col.dataset.date, time: minsToLabel(mins) };
          showGhost(col, mins, (cfg && +cfg.duration)||60);
          b.textContent = `${dd.getMonth()+1}/${dd.getDate()}　${minsToLabel(mins)}–${endTimeStr(minsToLabel(mins), (cfg&&cfg.duration)||60)}`;
        }
        b.style.left = Math.min(Math.max(8, m.cx+16), window.innerWidth-200)+'px';
        b.style.top = Math.max(8, m.cy-52)+'px';
      };
      const onMove = (ev)=>{
        m.cx = ev.clientX; m.cy = ev.clientY;
        if(!m.moved){
          if(Math.hypot(m.cx-m.x, m.cy-m.y) < 6) return;
          m.moved = true; card.classList.add('mdrag'); card.style.zIndex = 60; card.style.pointerEvents = 'none';
          timer = setInterval(()=>{
            const H = window.innerHeight, W = window.innerWidth;
            if(m.cy < 70) window.scrollBy(0,-18); else if(m.cy > H-70) window.scrollBy(0,18);
            const bs = card.closest('.board-scroll');
            if(bs){ if(m.cx < 90) bs.scrollLeft -= 18; else if(m.cx > W-90) bs.scrollLeft += 18; }
            upd();
          }, 40);
        }
        ev.preventDefault();
        upd();
      };
      const onUp = ()=>{
        window.removeEventListener('mousemove', onMove, true);
        window.removeEventListener('mouseup', onUp, true);
        if(timer) clearInterval(timer);
        if(!m.moved) return;
        adjSuppressUntil = Date.now()+400;
        clearB(); clearGhost();
        card.classList.remove('mdrag'); card.style.transform=''; card.style.zIndex=''; card.style.pointerEvents='';
        if(m.target){
          const cfg = cfg0(); const it = cfg && adjItem(cfg);
          if(it && (it.date!==m.target.date || it.time!==m.target.time)){ it.date = m.target.date; it.time = m.target.time; renderCalendarPanel(scope); adjSave(cfg); }
        }
      };
      window.addEventListener('mousemove', onMove, true);
      window.addEventListener('mouseup', onUp, true);
    });
    card.addEventListener('touchend', end);
    card.addEventListener('touchcancel', end);
  });
}

async function moveItem(cfg, newDate, newTime){
  const list = cfg.sourceType==='group' ? groupItems : personalItems;
  const it = list.find(x=>x.id===cfg.id);
  if(!it) return;
  it.date = newDate; it.time = newTime;
  renderCalendarPanel(scope);
  if(cfg.sourceType==='group'){ await sset('group-items', groupItems, true); }
  else{ await sset('personal-items', personalItems, false); await syncPublicPersonal(); }
}

function wireResizeHandles(mode){
  const mount = document.getElementById('scope-content');
  if(!mount) return;
  const horiz = layout==='rows';
  const unit = horiz ? ROWW : ROW_H;
  mount.querySelectorAll('.resize-handle').forEach(handle=>{
    handle.addEventListener('mousedown', (e)=>{ e.stopPropagation(); e.preventDefault(); const c = handle.closest('.item-card'); if(c) c.setAttribute('draggable','false'); });
    handle.addEventListener('dragstart', (e)=>{ e.preventDefault(); e.stopPropagation(); });
    handle.addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
      e.preventDefault();
      const card = handle.closest('.item-card');
      const cfg = cardRegistry[handle.dataset.resizeKey];
      if(!card || !cfg) return;
      const start = horiz ? e.clientX : e.clientY;
      const startSize = horiz ? card.offsetWidth : card.offsetHeight;
      card.setAttribute('draggable', 'false');
      card.classList.add('resizing');
      const liveLabel = document.createElement('div');
      liveLabel.className = 'resize-bubble';
      document.body.appendChild(liveLabel);
      let finalDuration = cfg.duration;
      const showBubble = (mins, ev)=>{
        const h = Math.floor(mins/60), m = mins%60;
        const dl = mins - cfg.duration;
        const tEl = card.querySelector('.item-time'); if(tEl) tEl.textContent = cfg.time + '–' + endTimeStr(cfg.time, mins);
        liveLabel.textContent = cfg.time + '–' + endTimeStr(cfg.time, mins) + '　' + (h? h+'小時':'') + (m? (h?' ':'')+m+'分':'') + (dl? '　（'+(dl>0?'+':'−')+Math.abs(dl)+'分）' : '');
        const r = card.getBoundingClientRect();
        const x = Math.min(Math.max(8, (ev? ev.clientX : r.left+r.width/2) - 70), window.innerWidth - 180);
        const y = Math.max(8, (ev? ev.clientY : r.bottom) - 56);
        liveLabel.style.left = x+'px'; liveLabel.style.top = y+'px';
      };
      showBubble(finalDuration, e);
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}

      function onMove(ev){
        const d = (horiz ? ev.clientX : ev.clientY) - start;
        const ns = Math.max(20, startSize + d);
        card.style[horiz ? 'width' : 'height'] = ns+'px';
        let mins = Math.round(((ns+3)/unit*60)/15)*15;
        mins = Math.max(15, mins);
        finalDuration = mins;
        showBubble(mins, ev);
      }
      function onUp(){
        handle.removeEventListener('pointermove', onMove);
        handle.removeEventListener('pointerup', onUp);
        try{ handle.releasePointerCapture(e.pointerId); }catch(err){}
        card.classList.remove('resizing');
        card.setAttribute('draggable', cfg.editable ? 'true' : 'false');
        liveLabel.remove();
        commitResize(cfg, finalDuration);
      }
      handle.addEventListener('pointermove', onMove);
      handle.addEventListener('pointerup', onUp);
    });
  });
}

async function commitResize(cfg, duration){
  const list = cfg.sourceType==='group' ? groupItems : personalItems;
  const it = list.find(x=>x.id===cfg.id);
  if(!it || it.duration===duration){ renderCalendarPanel(scope); return; }
  it.duration = duration;
  renderCalendarPanel(scope);
  if(cfg.sourceType==='group'){ await sset('group-items', groupItems, true); }
  else{ await sset('personal-items', personalItems, false); await syncPublicPersonal(); }

  return CREW_FIGS.map(src=>`<div class="crew-one fig"><img class="crew-fig" src="${src}" alt=""></div>`).join('');

function headerHtml(rangeLabel){
  const body = `
    <div class="ph-body">
      <button type="button" class="sticker-slot ph-stk" id="sticker-slot" title="揀頭像／上傳自己張相">
        ${mySticker ? `<img src="${mySticker}">` : `<span>＋頭像</span>`}
      </button>
      <input type="file" id="sticker-input" accept="image/*" style="display:none;">
      <div class="ph-eyebrow">ITINERARY</div>
      <div class="ph-title">${escapeHtml(trip.title)}<button class="edit-title" id="edit-trip">編輯</button></div>
      <div class="ph-meta"><span><b>日期</b> ${rangeLabel}</span><span><b>天數</b> DAY 1–${trip.days}</span><span><b>你</b> ${escapeHtml(myName)}</span></div>
    </div>`;
  if(true){
    return `<header class="paper-head custom"><div class="ph-wrap"><img class="ph-img" src="${headerImg || DEFAULT_HEADER_IMG}" alt="">${body}<div class="ph-crew" id="ph-crew">${crewHtml()}</div></div></header>`;
  }
  const clip = `<svg class="ph-clip" viewBox="0 0 160 88" aria-hidden="true">
    <defs>
      <linearGradient id="gd1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8E7A8"/><stop offset=".5" stop-color="#DDAE3E"/><stop offset="1" stop-color="#B98421"/></linearGradient>
      <linearGradient id="gd2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C99528" stop-opacity=".55"/><stop offset=".5" stop-color="#FFF3C2" stop-opacity=".5"/><stop offset="1" stop-color="#C99528" stop-opacity=".55"/></linearGradient>
    </defs>
    <rect x="34" y="34" width="16" height="6" rx="2" fill="#B9B5AA"/><rect x="110" y="34" width="16" height="6" rx="2" fill="#B9B5AA"/>
    <path d="M58 3 H102 Q111 3 111 12 V42 Q111 50 121 56 L150 63 Q158 65 158 73 V84 H2 V73 Q2 65 10 63 L39 56 Q49 50 49 42 V12 Q49 3 58 3 Z" fill="url(#gd1)" stroke="#9A6F1A" stroke-width="1.2"/>
    <path d="M58 3 H102 Q111 3 111 12 V42 Q111 50 121 56 L150 63 Q158 65 158 73 V84 H2 V73 Q2 65 10 63 L39 56 Q49 50 49 42 V12 Q49 3 58 3 Z" fill="url(#gd2)"/>
    <circle cx="80" cy="14" r="3.6" fill="#FDFCF8" stroke="#9A6F1A" stroke-width="1"/>
    <rect x="2" y="76" width="156" height="8" fill="#B98421" opacity=".6"/>
    <path d="M16 70 L144 70" stroke="#FFF3C2" stroke-width="1.4" opacity=".7"/>
  </svg>`;
  return `<header class="paper-head"><div class="ph-wrap"><div class="ph-shadow"><div class="ph-paper"></div></div>${clip}${body}</div></header>`;
}

function deckleClip(){
  let seed = 11;
  const rnd = ()=>{ seed = (seed*16807) % 2147483647; return seed/2147483647; };
  const pts = [];
  for(let x=0; x<=100; x+=1.6) pts.push([x, rnd()*3.2]);
  for(let y=6; y<=100; y+=6) pts.push([100-rnd()*0.9, y]);
  for(let x=100; x>=0; x-=1.6) pts.push([x, 100-rnd()*3.2]);
  for(let y=94; y>=6; y-=6) pts.push([rnd()*0.9, y]);
  return 'polygon(' + pts.map(p=> p[0].toFixed(2)+'% '+p[1].toFixed(2)+'%').join(',') + ')';
}

let _starsUri = null;
function starsDataUri(){
  if(_starsUri) return _starsUri;
  let seed = 7;
  const rnd = ()=>{ seed = (seed*16807) % 2147483647; return seed/2147483647; };
  const W = 720, H = 1000;
  let s = '';
  for(let i=0; i<85; i++){
    const cx = 20 + rnd()*(W-40), cy = 20 + rnd()*(H-40), r = 7 + rnd()*8, rot = rnd()*72;
    const g = 150 + Math.floor(rnd()*80), op = 0.55 + rnd()*0.4;
    let pts = '';
    for(let k=0; k<10; k++){
      const ang = (Math.PI/5)*k - Math.PI/2, rr = (k%2===0) ? r : r*0.45;
      pts += (cx + rr*Math.cos(ang)).toFixed(1) + ',' + (cy + rr*Math.sin(ang)).toFixed(1) + ' ';
    }
    s += `<polygon points="${pts}" fill="rgb(${g},${g},${g+4})" opacity="${op.toFixed(2)}" transform="rotate(${rot.toFixed(0)} ${cx.toFixed(1)} ${cy.toFixed(1)})"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${s}</svg>`;
  _starsUri = 'data:image/svg+xml,' + encodeURIComponent(svg);
  return _starsUri;
}

function blobToDataUrl(blob){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(r.result);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
function shrinkToPng(dataUrl, maxSide){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxSide/Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      res(c.toDataURL('image/png'));
    };
    img.onerror = rej;
    img.src = dataUrl;
  });
}

function extractClipboardImage(e){
  const cd = e.clipboardData;
  if(!cd) return null;
  let file = null;
  for(const it of (cd.items||[])){
    if(it.kind==='file' && it.type.startsWith('image/')){ file = it.getAsFile(); break; }
  }
  if(!file && cd.files && cd.files.length){ file = Array.from(cd.files).find(f=> f.type.startsWith('image/')) || null; }
  if(file){ e.preventDefault(); return file; }
  const html = cd.getData('text/html');
  const m = html && html.match(/<img[^>]+src="(data:image[^"]+)"/i);
  if(m){ e.preventDefault(); return m[1]; }
  return null;
}

function wireStickers(mount){
  mount.querySelectorAll('.sticker:not(.other)').forEach(el=>{
    const sid = el.dataset.sid;
    const select = ()=>{
      selectedSticker = sid;
      mount.querySelectorAll('.sticker').forEach(x=> x.classList.toggle('sel', x.dataset.sid===sid));
    };
    el.querySelector('.st-del').addEventListener('pointerdown', (e)=> e.stopPropagation());
    el.querySelector('.st-del').addEventListener('click', async (e)=>{
      e.stopPropagation();
      stickers = stickers.filter(x=> x.id!==sid);
      delete stickerImgs[sid];
      selectedSticker = null;
      await sset('my-stickers', stickers, false); pushStickers();
      await sset('my-st-img:'+sid, null, false);
      renderCalendarPanel(scope);
    });
    el.querySelector('.st-rot').addEventListener('pointerdown', (e)=>{
      e.preventDefault(); e.stopPropagation();
      const s = stickers.find(x=> x.id===sid);
      if(!s) return;
      const r0 = el.getBoundingClientRect();
      const cx = r0.left + r0.width/2, cy = r0.top + r0.height/2;
      const a0 = Math.atan2(e.clientY-cy, e.clientX-cx) * 180/Math.PI;
      const base = s.rot || 0;
      const h = e.currentTarget;
      try{ h.setPointerCapture(e.pointerId); }catch(err){}
      let cur = base;
      const move = (ev)=>{
        const a = Math.atan2(ev.clientY-cy, ev.clientX-cx) * 180/Math.PI;
        cur = (((base + (a - a0)) % 360) + 360) % 360;
        const snap = Math.round(cur/45)*45;
        if(Math.abs(cur-snap) < 4) cur = snap % 360;
        el.style.transform = 'rotate(' + cur + 'deg)';
      };
      const up = async ()=>{
        h.removeEventListener('pointermove', move);
        h.removeEventListener('pointerup', up);
        h.removeEventListener('pointercancel', up);
        s.rot = Math.round(cur);
        await sset('my-stickers', stickers, false); pushStickers();
      };
      h.addEventListener('pointermove', move);
      h.addEventListener('pointerup', up);
      h.addEventListener('pointercancel', up);
    });
    el.querySelector('.st-resize').addEventListener('pointerdown', (e)=>{
      e.preventDefault(); e.stopPropagation();
      const startX = e.clientX, startY = e.clientY, startW = el.offsetWidth;
      const h = e.currentTarget;
      try{ h.setPointerCapture(e.pointerId); }catch(err){}
      const move = (ev)=>{
        const th = ((stickers.find(x=> x.id===sid)||{}).rot||0) * Math.PI/180;
        const d = (ev.clientX-startX)*Math.cos(th) + (ev.clientY-startY)*Math.sin(th);
        el.style.width = Math.max(40, Math.min(700, startW + d))+'px';
      };
      const up = async ()=>{
        h.removeEventListener('pointermove', move);
        h.removeEventListener('pointerup', up);
        const s = stickers.find(x=> x.id===sid);
        if(s){ s.w = Math.round(el.offsetWidth); await sset('my-stickers', stickers, false); pushStickers(); }
      };
      h.addEventListener('pointermove', move);
      h.addEventListener('pointerup', up);
    });
    el.addEventListener('pointerdown', (e)=>{
      if(e.target.closest('.st-del') || e.target.closest('.st-resize') || e.target.closest('.st-rot')) return;
      e.preventDefault(); e.stopPropagation();
      select();
      const startX = e.clientX, startY = e.clientY;
      const origL = parseFloat(el.style.left)||0, origT = parseFloat(el.style.top)||0;
      let moved = false;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      const move = (ev)=>{
        const dx = ev.clientX-startX, dy = ev.clientY-startY;
        if(Math.abs(dx)+Math.abs(dy) > 3) moved = true;
        el.style.left = (origL+dx)+'px';
        el.style.top = (origT+dy)+'px';
      };
      const up = async ()=>{
        el.removeEventListener('pointermove', move);
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
        if(moved) await finalizeStickerMove(el, sid);
      };
      el.addEventListener('pointermove', move);
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    });
  });
}

async function finalizeStickerMove(el, sid){
  const s = stickers.find(x=> x.id===sid);
  if(!s) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height/2;
  const bodies = Array.from(document.querySelectorAll('#scope-content .day-body')).filter(b=> b.getBoundingClientRect().width>0);
  let target = null;
  for(const b of bodies){
    const br = b.getBoundingClientRect();
    if(cx>=br.left && cx<=br.right && cy>=br.top && cy<=br.bottom){ target = b; break; }
  }
  const parent = target || el.parentElement;
  const pr = parent.getBoundingClientRect();
  const x = Math.round(cx - pr.left - el.offsetWidth/2), y = Math.round(cy - pr.top - el.offsetHeight/2);
  if(target && target !== el.parentElement){
    target.appendChild(el);
    el.style.left = x+'px'; el.style.top = y+'px';
    s.date = target.dataset.date;
  }
  if(layout==='rows'){ s.t = x/ROWW; s.f = pr.height ? y/pr.height : 0; }
  else{ s.t = y/ROW_H; s.f = pr.width ? x/pr.width : 0; }
  s.f = Math.max(-0.3, Math.min(1.1, s.f));
  await sset('my-stickers', stickers, false); pushStickers();
}

    if(j && j.error){ _geoNote = 'Google 搵位置出錯：' + String(j.error).slice(0, 70); return undefined; }
    _srvGeo = false;          // 舊版 Code.gs，之後唔再試
  }catch(e){ _geoNote = (e && e.name==='AbortError') ? 'Google 搵位置太耐' : ''; }
  return undefined;
}
async function geocodeNominatim(q){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=zh-HK,zh,en&q=' + encodeURIComponent(q);
  const r = await fetchT(url, { headers:{ 'Accept':'application/json' } }, 12000);
  if(!r.ok) throw new Error('geo ' + r.status);
  const j = await r.json();
  if(!(j && j[0])) return null;
  const t = j[0];
  const coarse = (t.class==='boundary' || t.class==='place') && /administrative|city|town|village|suburb|state|region|island|quarter|neighbourhood|district|county|country|municipality|peninsula/i.test(t.type||'');
  return [parseFloat(t.lat), parseFloat(t.lon), coarse];
}
function addrVariants(a){
  a = String(a||'').trim();
  const out = [a];
  const m = /^(.*?\d+(?:[-–]\d+)?\s*號)/.exec(a);                      // 去掉「號」之後嘅舖位／樓層（例如「地下A2」）
  if(m && m[1] !== a) out.push(m[1]);
  const street = a.replace(/\d+(?:[-–]\d+)?\s*號.*$/, '').trim();    // 只剩街名（位置會較大約）
  if(street && !out.includes(street)) out.push(street);
  return out.map((v,i)=>({ q:v, coarse: i===out.length-1 && out.length>1 }));
}
async function geocodeText(q){
  // 1) Google 地圖服務；2) 備用：OpenStreetMap（逐步簡化地址再試）
  const g = await geocodeServer(q);
  if(g) return g;
  const vars = addrVariants(q);
  let first = true;
  for(const v of vars){
    if(!first) await new Promise(r=> setTimeout(r, 1100));
    first = false;
    let c = null;
    try{ c = await geocodeNominatim(v.q); }
    catch(e){ _geoNote = '備用搜尋出錯：' + ((e && e.message) || e); continue; }
    if(c) return [c[0], c[1], c[2] || v.coarse];
  }
  return null;
}

}

function groupedCardsHtml(list, htmls){
  let out = '', cur = null, open = false, gi = 0;
  list.forEach((c,i)=>{
    const k = labelKey(c);
    if(cur===null || k!==cur){
      if(open) out += '</div>';
      const n = list.filter(x=> labelKey(x)===k).length;
      const dot = c.color ? `<span class="lab-dot" style="background:${c.color}"></span>` : '';
      out += `<div class="bk-h cand-sec" id="cand-sec-${gi++}">${dot}${k ? escapeHtml(k) : '未分類'} · ${n}</div><div class="candidate-list">`;
      cur = k; open = true;
    }
    out += htmls[i];
  });

}
function normIg(v){
  v = String(v||'').trim();
  if(!v) return '';
  let m = /https?:\/\/[^\s<>"']*instagram\.com[^\s<>"']*/i.exec(v);
  if(m) return m[0];
  m = /(?:www\.)?instagram\.com\/[^\s<>"']*/i.exec(v);
  if(m) return 'https://' + m[0];
  m = /^@?([A-Za-z0-9._]{2,30})$/.exec(v);
  if(m) return 'https://www.instagram.com/' + m[1] + '/';
  return /^https?:\/\//i.test(v) ? v : '';
}
function igBtnHtml(u){
  u = normIg(u);
  return u ? `<a class="ghost-btn map-open" href="${escapeHtml(u)}" target="_blank" rel="noopener">📷 睇 IG</a>` : '';
}
const TR_MODES = [
  { k:'bus', i:'🚌', l:'巴士' }, { k:'taxi', i:'🚕', l:'的士' }, { k:'metro', i:'🚇', l:'地鐵' }, { k:'train', i:'🚆', l:'火車' },
  { k:'walk', i:'🚶', l:'步行' }, { k:'ferry', i:'⛴️', l:'船' }, { k:'car', i:'🚗', l:'自駕' }, { k:'other', i:'🧭', l:'其他' }
];
function trMode(k){ return TR_MODES.find(m=>m.k===k) || TR_MODES[7]; }
function trChosenOf(o){
  const ops = (o && o.options) || [];
  return ops.find(x=> x.id===o.chosen) || ops[0] || null;
}
function transitViewHtml(o){

/* ---------------- 備註入面嘅網址 → 可撳連結 ---------------- */
function linkify(text){
  const esc = escapeHtml(text || '');
  return esc.replace(/((?:https?:\/\/|www\.)[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+)/gi, (m)=>{
    let url = m, tail = '';
    const t = /(?:[.,;:!?)\]）」』。，、！？]|&quot;|&#39;|&gt;|&lt;)+$/.exec(url);
    if(t){ tail = t[0]; url = url.slice(0, url.length - tail.length); }
    if(!url) return m;
    const href = /^www\./i.test(url) ? 'https://' + url : url;
    return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" class="note-a">' + url + '</a>' + tail;
  });
}
function extractUrls(t){
  const out = [];
  String(t || '').replace(/((?:https?:\/\/|www\.)[A-Za-z0-9\-._~:\/?#\[\]@!$&'()*+,;=%]+)/gi, (m)=>{ out.push(m.replace(/[.,;:!?]+$/, '')); return m; });
  return out;
}
function wireNoteLinks(overlay, sel){
  const ta = overlay.querySelector(sel);
  if(!ta) return;
  const box = document.createElement('div');
  box.className = 'note-links';
  ta.insertAdjacentElement('afterend', box);
  const upd = ()=>{
    const us = extractUrls(ta.value);
    box.innerHTML = us.map(u=>{
      const href = /^www\./i.test(u) ? 'https://' + u : u;
      const label = u.replace(/^https?:\/\/(www\.)?/i, '').slice(0, 42);
      return '<a href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">🔗 ' + escapeHtml(label) + '</a>';
    }).join('');
  };
  ta.addEventListener('input', upd);
  upd();
}

function candPri(c){ return c.pri || (c.votes && c.votes[c.proposedBy]) || 'nice'; }
function candJoiners(c){
  const out = [];
  const add = n=>{ if(n && !out.includes(n)) out.push(n); };
  add(c.proposedBy);
  if(Array.isArray(c.joined)) c.joined.forEach(add); else Object.keys(c.votes||{}).forEach(add);
  return out;
}
function joinBlockHtml(gid){

function wireJoinBlock(overlay){

      trOut = trOpts.filter(o=> (o.label||'').trim() || +o.mins).map(o=>({ id:o.id, mode:o.mode||'bus', label:(o.label||'').trim(), mins: +o.mins||0, cost: (o.cost==null?'':String(o.cost)).trim() }));
      const pk = trOut.find(o=>o.id===trChosen) || trOut.slice().sort((a,b)=>(a.mins||9999)-(b.mins||9999))[0];
      trPick = pk ? pk.id : '';
      trDur = Math.max(15, (pk && pk.mins) || 30);
    }
    const updated = {
      id: it.id,
      title,
      date: overlay.querySelector('#f-date').value,
      time: overlay.querySelector('#f-time').value,
      duration: isTransit ? trDur : Math.max(15, parseInt(overlay.querySelector('#f-duration').value)||60),
      type: isTransit ? 'transit' : undefined, options: isTransit ? trOut : undefined, chosen: isTransit ? trPick : undefined,
      igUrl: normIg(overlay.querySelector('#f-ig').value),
      location: overlay.querySelector('#f-location').value.trim(),
      address: overlay.querySelector('#f-address').value.trim(),
      lat: it.lat, lng: it.lng, geoKey: it.geoKey, geoSrc: it.geoSrc, geoFail: it.geoFail,
      mapUrl: cleanMapUrl(overlay.querySelector('#f-mapurl').value),
      notes: overlay.querySelector('#f-notes').value.trim(),
      photos,
      tag: lab.tag(),
      color: lab.color(),
      fromBooking: it.fromBooking || undefined,
      owner: it.owner || myName,
      plan: currentScope==='group' ? (it.plan || (editing ? planOf(it) : (opts.planTarget || selPlans()[0]))) : undefined,
      fromCand: currentScope==='group' ? (it.fromCand || (prefillCand ? prefillCand.id : undefined)) : undefined,
      participants: (function(){ let ps = ((it.participants||[]).length || (editing && modalScope===currentScope)) ? (it.participants||[]).slice() : (currentScope==='group' ? [myName] : []); const ow = it.owner || myName; if(currentScope==='group' && !ps.includes(ow)) ps.unshift(ow); return ps; })(),
      visibility: currentScope==='personal'
        ? (overlay.querySelector('input[name="f-visibility"]:checked')||{}).value || 'private'
        : 'private'
    };

    await lab.persist();
    if(editing && modalScope !== currentScope){
      if(modalScope==='group') groupItems = groupItems.filter(x=>x.id!==it.id);
      else personalItems = personalItems.filter(x=>x.id!==it.id);
    }

    if(currentScope==='group'){
      const idx = groupItems.findIndex(x=>x.id===it.id);
      if(idx>=0) groupItems[idx] = updated; else groupItems.push(updated);
      await sset('group-items', groupItems, true);
    }else{
      const idx = personalItems.findIndex(x=>x.id===it.id);
      if(idx>=0) personalItems[idx] = updated; else personalItems.push(updated);
      await sset('personal-items', personalItems, false);
      await syncPublicPersonal();
    }

    if(prefillCand && currentScope!=='group'){
      candidates = candidates.filter(c=>c.id!==prefillCand.id);
      await sset('candidates', candidates, true);
    }

    scope = currentScope;
    close();
    renderApp();
  };
}

const MONTH_NAMES = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
function monthGridHtml(year, month, startStr, endStr){
  const lead = new Date(year, month, 1).getDay(); // Sunday first
  const dim = new Date(year, month+1, 0).getDate();
  let cells = '';
  for(let i=0;i<lead;i++) cells += '<div class="cp-day empty"></div>';
  for(let d=1; d<=dim; d++){
    const ds = year+'-'+pad(month+1)+'-'+pad(d);
    const cls = ['cp-day'];
    if((lead+d-1)%7===0) cls.push('sun');
    if(ds>=startStr && ds<=endStr) cls.push('in-trip');
    if(ds===startStr) cls.push('is-start');
    if(ds===endStr) cls.push('is-end');
    cells += `<div class="${cls.join(' ')}"><span>${d}</span></div>`;
  }
  return `<div class="cp-grid">${cells}</div>`;
}

function renderCoverScreen(){
  const app = document.getElementById('app');
  const dates = tripDates();
  const start = dates[0], end = dates[dates.length-1];
  const sd = parseDate(start), ed = parseDate(end);
  const months = [];
  let y = sd.getFullYear(), m = sd.getMonth();
  while(y < ed.getFullYear() || (y===ed.getFullYear() && m<=ed.getMonth())){
    months.push({y,m}); m++; if(m>11){ m=0; y++; }
  }
  const years = Array.from(new Set(months.map(x=>x.y))).join(' / ');
  const dest = (trip.destination || trip.title || '').trim();
  const dow = ['S','M','T','W','T','F','S'].map(d=>`<span>${d}</span>`).join('');
  const monthsHtml = months.map(({y,m})=>`
    <div class="cp-month">
      <div class="cp-month-title">${MONTH_NAMES[m].toLowerCase()}.</div>
      <div class="cp-dow">${dow}</div>
      <div class="cp-rule"></div>
      ${monthGridHtml(y,m,start,end)}
    </div>`).join('');
  app.innerHTML = `
    <div class="cover-screen" id="cover-screen">
      <div class="cover-tools">

        <div class="cp-shadow"><div class="cp-paper">
          ${monthsHtml}
          <div class="cp-year">${years}</div>
          <div class="cp-dest">${escapeHtml(dest)}</div>
          <div class="cp-range">${start} → ${end} · ${trip.days} DAYS</div>
          <button type="button" class="cp-enter" id="cover-enter">進入行程 →</button>
        </div></div>
      </div>
    </div>`;
  const screen = document.getElementById('cover-screen');
  if(coverBg){ screen.style.backgroundImage = 'url("'+coverBg+'")'; screen.classList.add('has-bg'); }
  document.getElementById('cover-enter').onclick = ()=>{ showCover = false; renderApp(); };
  document.getElementById('cover-edit').onclick = openTripModal;
  const input = document.getElementById('cover-bg-input');
  document.getElementById('cover-bg-btn').onclick = ()=> input.click();
  input.addEventListener('change', async (e)=>{
    const f = e.target.files[0]; e.target.value = '';

  expenses.forEach(x=>{ add(x.paidBy); (x.forWho||[]).forEach(add); });

/* ---------------- booking places (address + Google Map; 2 places for flight/train/ferry) ---------------- */
function bkPlaceDefs(type){
  // [key, 標題, 名稱 placeholder, 短標, 地圖 pin 字]
  if(type==='flight') return [['from','🛫 起飛機場','例如：香港國際機場','起飛','🛫'],['to','🛬 降落機場','例如：成田國際機場','降落','🛬']];
  if(type==='train')  return [['from','🚉 上車站','例如：東京站','上車','🚉上'],['to','🚉 落車站','例如：京都站','落車','🚉落']];
  if(type==='ferry')  return [['from','⛴️ 上船碼頭','例如：港澳碼頭','上船','⛴️上'],['to','⛴️ 落船碼頭','例如：外港客運碼頭','落船','⛴️落']];
  if(type==='hotel')  return [['at','🏨 酒店地點','','酒店','🏨']];
  return [['at','📍 地點','','地點','🎫']];
}
function bkEffOf(type, name, key, p){
  p = p || {};
  return { title: name||'', location: (p.location||'').trim() || (key==='at' ? (name||'') : ''), address: (p.address||'').trim(), mapUrl: (p.mapUrl||'').trim() };
}
function bkEff(b, key){ return bkEffOf(b.type, b.name, key, (b.places||{})[key]); }
function bkPlaceHas(b, key){ const p = (b.places||{})[key] || {}; return !!((p.address||'').trim() || (p.mapUrl||'').trim()); }
function bkHasPlaces(b){ return bkPlaceDefs(b.type).some(d=> bkPlaceHas(b, d[0])); }
function bkItemPlace(b){
  const key = (b.type==='hotel' || b.type==='other') ? 'at' : 'from';
  const p = (b.places||{})[key] || {};

function bkRouteLink(b){

function bookingsOn(dateStr){

  bookings.forEach(b=>{

    } else if(b.date===dateStr) out.push({ b, role:'one' });

function hotelGaps(){
  const tripNights = Math.max(0, ((trip && trip.days) || 1) - 1);
  const nights = [];
  for(let i=0;i<tripNights;i++) nights.push(addDays(trip.startDate, i));
  const groups = new Map(); // key(missing nights) -> names
  allNames().forEach(m=>{
    const cov = new Set();
    bookings.filter(b=> b.type==='hotel' && b.booked && b.date && bkIncludes(b, m.name)).forEach(b=>{
      for(let i=0;i<Math.max(1,+b.nights||1);i++) cov.add(addDays(b.date, i));
    });
    const miss = nights.filter(d=>!cov.has(d));
    if(miss.length){ const k = miss.join(','); if(!groups.has(k)) groups.set(k, { miss, names:[] }); groups.get(k).names.push(m.name); }
  });
  return { nights: tripNights, groups: Array.from(groups.values()) };
}

function enableHScroll(el){
  if(!el || el._hs) return; el._hs = true;
  el.addEventListener('wheel', e=>{
    if(el.scrollWidth <= el.clientWidth + 2) return;
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    const atL = el.scrollLeft <= 0, atR = el.scrollLeft + el.clientWidth >= el.scrollWidth - 1;
    if((e.deltaY < 0 && atL) || (e.deltaY > 0 && atR)) return;   // 到頭／到尾就畀頁面照常上下捲
    el.scrollLeft += e.deltaY; e.preventDefault();
  }, { passive:false });
  let down = false, sx = 0, sl = 0, moved = false;
  el.addEventListener('pointerdown', e=>{ if(e.pointerType!=='mouse') return; down = true; moved = false; sx = e.clientX; sl = el.scrollLeft; });
  window.addEventListener('pointermove', e=>{ if(!down) return; const dx = e.clientX - sx; if(Math.abs(dx) > 4) moved = true; if(moved) el.scrollLeft = sl - dx; });
  window.addEventListener('pointerup', ()=>{ down = false; });
  el.addEventListener('click', e=>{ if(moved){ e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
}

/* ---------------- bookings (hotel / flight / train / ferry) ---------------- */
const BK_TYPES = [
  { k:'hotel',  icon:'🏨', label:'酒店' },

  { k:'train',  icon:'🚄', label:'車票' },

function bkType(k){ return BK_TYPES.find(t=>t.k===k) || BK_TYPES[4]; }
function bkMD(d){ return d ? d.slice(5).replace('-','/') : ''; }
function renderBookingsPanel(){
  const mount = document.getElementById('scope-content');

  list.filter(b=> b.type==='hotel' && b.booked && b.date).forEach(b=>{
    for(let i=0;i<Math.max(1, +b.nights||1);i++) covered.add(addDays(b.date, i));
  });
  const nightDates = [];
  for(let i=0;i<tripNights;i++) nightDates.push(addDays(trip.startDate, i));
  const missing = nightDates.filter(d=> !covered.has(d));

    const t = bkType(b.type);

  });
  mount.querySelectorAll('[data-act="remove"]').forEach(btn=>{

/* ---------------- 支出表 + 夾錢結算 ---------------- */
const X_CATS = [['food','🍜 食'],['traffic','🚇 交通'],['stay','🏨 住'],['ticket','🎟 門票'],['shop','🛍 買嘢'],['other','📦 其他']];
let xCur = 'HK$';
const toCents = v => Math.round((parseFloat(v)||0) * 100);
const fmtC = c => { const neg = c<0; c = Math.abs(c); const w = Math.floor(c/100), f = c%100; return (neg?'-':'') + xCur + w.toLocaleString('en-US') + (f ? '.' + String(f).padStart(2,'0') : ''); };
function xCatLabel(k){ const f = X_CATS.find(c=>c[0]===k); return f ? f[1] : '📦 其他'; }
/* 每人 paid / share（以「分」計，除唔盡嘅尾數逐個人派，總數永遠對得上） */
function calcSettlement(list){
  const paid = {}, share = {};
  const bump = (o,n,v)=>{ o[n] = (o[n]||0) + v; };
  let total = 0;
  list.forEach(x=>{
    const amt = x.cents != null ? x.cents : toCents(x.amount);
    const who = (x.forWho && x.forWho.length) ? x.forWho.slice() : [x.paidBy];
    if(!x.paidBy || !amt) return;
    total += amt; bump(paid, x.paidBy, amt);
    const base = Math.floor(amt / who.length); let rem = amt - base * who.length;
    who.forEach(n=>{ bump(share, n, base + (rem>0 ? 1 : 0)); if(rem>0) rem--; });
  });
  const names = Array.from(new Set(Object.keys(paid).concat(Object.keys(share))));
  const rows = names.map(n=>({ name:n, paid:paid[n]||0, share:share[n]||0, net:(paid[n]||0)-(share[n]||0) }));
  const cr = rows.filter(r=>r.net>0).map(r=>({n:r.name, v:r.net})).sort((a,b)=>b.v-a.v);
  const db = rows.filter(r=>r.net<0).map(r=>({n:r.name, v:-r.net})).sort((a,b)=>b.v-a.v);
  const pay = [];
  let i=0, j=0;
  while(i<db.length && j<cr.length){
    const m = Math.min(db[i].v, cr[j].v);
    if(m>0) pay.push({ from:db[i].n, to:cr[j].n, v:m });
    db[i].v -= m; cr[j].v -= m;
    if(db[i].v===0) i++; if(cr[j].v===0) j++;
  }
  rows.sort((a,b)=>b.net-a.net);
  return { total, rows, pay };
}

async function renameMe(newName){
  newName = (newName||'').trim();
  const old = myName;
  if(!newName || newName===old) return false;
  const swap = (arr)=> (arr||[]).map(p=> p===old ? newName : p);
  groupItems = (await sget('group-items', true)) || []; plans = (await sget('plans', true)) || [];
  candidates = (await sget('candidates', true)) || [];
  bookings = (await sget('bookings', true)) || [];
  expenses = (await sget('expenses', true)) || [];
  groupItems.forEach(it=>{ if(it.owner===old) it.owner = newName; if(it.participants) it.participants = swap(it.participants); });
  personalItems.forEach(it=>{ if(it.owner===old) it.owner = newName; if(it.participants) it.participants = swap(it.participants); });
  candidates.forEach(c=>{
    if(c.proposedBy===old) c.proposedBy = newName;
    if(Array.isArray(c.joined)) c.joined = swap(c.joined);
    if(c.votes && Object.prototype.hasOwnProperty.call(c.votes, old)){ c.votes[newName] = c.votes[old]; delete c.votes[old]; }
  });
  myName = newName;
  await sset('my-name', myName, false);
  await sset('group-items', groupItems, true);
  bookings = (await sget('bookings', true)) || [];
  expenses = (await sget('expenses', true)) || [];
  bookings.forEach(b=>{ if(b.by===old) b.by = newName; if(Array.isArray(b.members)) b.members = swap(b.members); });
  await sset('bookings', bookings, true);
  await sset('candidates', candidates, true);
  await sset('personal-items', personalItems, false);
  await sset('public-personal:'+old, [], true);
  delete publicOthers[old];
  await syncPublicPersonal();
  try{
    if(DB){
      await refreshShared();
      const oid = 'm_' + hex(old);
      const oaid = 'a_' + hex(old);
      const chg = {};
      if(sh.docs.has(oid)) chg['docs/'+oid] = null;
      if(sh.docs.has(oaid)) chg['docs/'+oaid] = null;
      if(sh.docs.has('r_'+hex(newName))) chg['docs/r_'+hex(newName)] = null;   // 改返用舊名：取消舊記錄
      chg['docs/r_'+hex(old)] = { o:0, j: JSON.stringify({ from:old, to:newName, at:Date.now() }) };
      await patchDocs(chg);
      const d = new Map(sh.docs);
      Object.keys(chg).forEach(k=>{ if(chg[k]===null) d.delete(k.slice(5)); else d.set(k.slice(5), chg[k]); });
      rebuild(d, sh.trip);
      await registerMe();
      pushStickers();
    }
  }catch(e){}
  return true;
}

  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>編輯行程資料</h3><button class="modal-close">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>行程名稱</label><input type="text" id="t-title" value="${escapeHtml(trip.title)}"></div>
        <div class="field"><label>目的地</label><input type="text" id="t-dest" value="${escapeHtml(trip.destination||'')}"></div>
        <div class="row2">
          <div class="field"><label>出發日期</label><input type="date" id="t-start" value="${trip.startDate}"></div>
          <div class="field"><label>總天數</label><input type="number" id="t-days" min="1" max="21" value="${trip.days}"></div>
        </div>
        <div class="field"><label>你嘅名</label><input type="text" id="t-name" value="${escapeHtml(myName)}"></div>
        <div class="modal-actions">
          <button class="ghost-btn" id="t-cancel">取消</button>
          <button class="primary-btn" id="t-save">儲存</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('.modal-close').onclick = close;
  overlay.querySelector('#t-cancel').onclick = close;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#t-save').onclick = async ()=>{
    trip = {
      title: overlay.querySelector('#t-title').value.trim() || trip.title,
      destination: overlay.querySelector('#t-dest').value.trim(),
      startDate: overlay.querySelector('#t-start').value || trip.startDate,
      days: Math.max(1, Math.min(21, parseInt(overlay.querySelector('#t-days').value)||trip.days))
    };
    const newNm = overlay.querySelector('#t-name').value.trim();
    await sset('trip-config', trip, true);
    if(newNm && newNm!==myName) await renameMe(newNm);
    close();
    renderApp();
  };
}

function openAvatarPicker(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>揀頭像</h3><button class="modal-close">✕</button></div>
      <div class="modal-body">
        <div class="av-grid">${AVATAR_PRESETS.map((src,i)=>`<button type="button" class="av-opt${src===mySticker?' on':''}" data-i="${i}"><img src="${src}" alt=""></button>`).join('')}</div>
        <div class="modal-actions" style="margin-top:14px;">
          <button class="ghost-btn" id="av-cancel">取消</button>
          <button class="primary-btn" id="av-upload">📷 上傳自己張相</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.querySelector('.modal-close').onclick = close;
  overlay.querySelector('#av-cancel').onclick = close;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#av-upload').onclick = ()=>{ close(); const inp = document.getElementById('sticker-input'); if(inp) inp.click(); };
  overlay.querySelectorAll('.av-opt').forEach(b=>{
    b.onclick = async ()=>{
      const src = AVATAR_PRESETS[+b.dataset.i];
      if(!src) return;
      close();
      mySticker = src;
      myStickerAt = Date.now();
      await sset('my-sticker', mySticker, false);
      await sset('my-sticker-at', myStickerAt, false);
      renderApp();
      registerMe().then(renderMemberBar);
    };
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

init();
})();
</script>
</body>
</html>
