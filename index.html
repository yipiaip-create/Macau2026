<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>旅行行程表</title>
<meta name="apple-mobile-web-app-title" content="旅行行程表">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Baloo+2:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FDFCF8;
    --paper-2: #F5F1E4;
    --ink: #40311F;
    --ink-soft: #93816B;
    --peach: #F6D876;
    --peach-deep: #E0AF2E;
    --blue: #A9D6D2;
    --blue-deep: #5AA6A0;
    --mint: #BEE0CE;
    --mint-deep: #5FA98F;
    --pink: #F1BEB4;
    --pink-deep: #DD8578;
    --gold: #D9A441;
    --lavender: #CFC5EA;
    --lavender-deep: #9C8BC9;
    --butter: #F3D98B;
    --butter-deep: #DDA92E;
    --dusty: #C3D2DE;
    --dusty-deep: #6E8CA3;
    --olive: #C8D1A6;
    --olive-deep: #7C8C4C;
    --line: #E7D8C1;
    --line-strong: #D2BE9B;
    --card-personal: #FFF9E4;
    --card-group: #E9F6F4;
    --card-other: #FBF2D8;
    --card-candidate: #EAF7F0;
    --shadow: 3px 3px 0 rgba(64,49,31,0.14);
    --shadow-soft: 0 2px 0 rgba(64,49,31,0.06), 0 8px 20px -10px rgba(64,49,31,0.28);
    --radius: 3px;
    --font-display: 'Baloo 2', 'Space Grotesk', 'Noto Sans TC', sans-serif;
    --font-body: 'Noto Sans TC', 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  :root{ color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html,body{height:100%;}
  body{
    margin:0;
    background:
      url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22132%22%20height%3D%2240%22%20viewBox%3D%220%200%20132%2040%22%3E%3Crect%20x%3D%2214%22%20y%3D%220%22%20width%3D%2220%22%20height%3D%2240%22%20fill%3D%22%23E0AF2E%22%20fill-opacity%3D%220.12%22/%3E%3Crect%20x%3D%2216%22%20y%3D%220%22%20width%3D%2215%22%20height%3D%2240%22%20fill%3D%22%23E0AF2E%22%20fill-opacity%3D%220.07%22/%3E%3Cline%20x1%3D%2252%22%20y1%3D%220%22%20x2%3D%2252%22%20y2%3D%2240%22%20stroke%3D%22%237FA3B0%22%20stroke-width%3D%221.4%22%20stroke-opacity%3D%220.4%22/%3E%3C/svg%3E") 0 0/132px 40px repeat,
      radial-gradient(circle at 1px 1px, rgba(64,49,31,0.04) 1px, transparent 0) 0 0/16px 16px,
      var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--peach-deep); color:#fff;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ---------- Loading ---------- */
  #loading{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; background:var(--paper); z-index:999;
  }
  .stub-mark{width:46px; height:46px; border:3px solid var(--ink); border-radius:50%; border-top-color:var(--pink-deep);
    animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Ticket header ---------- */
  .app-shell{max-width:1200px; margin:0 auto; padding:0 18px 60px;}
  header.ticket{
    margin-top:22px;
    border:2px solid var(--ink);
    border-radius:22px 16px 24px 14px;
    background:var(--paper);
    display:flex;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  header.ticket::before{
    content:"";
    position:absolute; left:78%; top:0; bottom:0; width:0;
    border-left:2px dashed var(--line-strong);
  }
  header.ticket::after{
    content:""; position:absolute; left:0; top:0; bottom:0; width:7px;
    background:var(--blue-deep);
  }
  .doodle-star{position:absolute; width:20px; height:20px; opacity:.5; pointer-events:none;}
  .doodle-cloud{position:absolute; opacity:.55; pointer-events:none;}
  .ticket-main{flex:1; padding:18px 22px 18px 26px; min-width:0;}
  .ticket-eyebrow{
    font-family:var(--font-display); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--peach-deep); font-weight:600; margin-bottom:6px; display:flex; align-items:center; gap:8px;
  }
  .ticket-eyebrow .dot{width:5px; height:5px; border-radius:50%; background:var(--pink-deep);}
  .dot-trio{display:inline-flex; gap:4px; margin-right:2px;}
  .dot-trio span{width:5px; height:5px; border-radius:50%; display:inline-block;}
  .dot-trio span:nth-child(1){background:var(--peach-deep);}
  .dot-trio span:nth-child(2){background:var(--blue-deep);}
  .dot-trio span:nth-child(3){background:var(--mint-deep);}
  .ticket-title{
    font-family:var(--font-display); font-weight:700; font-size:clamp(22px,4vw,34px);
    margin:0 0 8px; letter-spacing:-.01em; color:var(--ink);
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  .ticket-title button.edit-title{
    border:none; background:none; font-size:12px; color:var(--ink-soft); text-decoration:underline;
    font-family:var(--font-body); padding:2px 4px;
  }
  .ticket-meta{display:flex; gap:22px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft);}
  .ticket-meta b{color:var(--ink); font-weight:700; font-family:var(--font-display);}
  .ticket-stub{
    width:22%; min-width:150px; padding:18px 16px; display:flex; flex-direction:column; justify-content:space-between;
    background:
      repeating-linear-gradient(90deg, rgba(110,140,163,0.14) 0 6px, transparent 6px 16px),
      repeating-linear-gradient(0deg, rgba(110,140,163,0.14) 0 6px, transparent 6px 16px),
      var(--paper-2);
    position:relative;
  }
  .stub-label{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;}
  .stub-name{font-family:var(--font-display); font-weight:700; font-size:18px; margin-top:3px; color:var(--blue-deep);}
  .barcode{height:30px; margin-top:10px;
    background:repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 9px);
    opacity:.8;}
  .sticker-slot{
    width:46px; height:46px; border-radius:50%; border:1.8px dashed var(--line-strong); background:#fff;
    display:flex; align-items:center; justify-content:center; overflow:hidden; padding:0; margin-bottom:8px;
    font-size:9px; color:var(--ink-soft); font-family:var(--font-display); font-weight:700; text-align:center; line-height:1.2;
  }
  .sticker-slot img{width:100%; height:100%; object-fit:cover;}
  .sticker-slot:hover{border-color:var(--ink);}

  /* ---------- Tabs ---------- */
  .tabbar{display:flex; align-items:center; gap:10px; margin:22px 0 14px; flex-wrap:wrap;}
  .tabs{display:flex; border:2px solid var(--ink); border-radius:999px; overflow:hidden; flex-wrap:wrap;}
  .tabs button{
    padding:9px 16px; border:none; background:var(--paper); font-weight:700; font-size:13.5px;
    font-family:var(--font-display); color:var(--ink-soft); letter-spacing:.01em;
    border-right:1.5px solid var(--ink);
  }
  .tabs button:last-child{border-right:none;}
  .tabs button.active{background:var(--ink); color:var(--paper);}
  .tabs button .tag-dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:middle;}
  .tabs button[data-scope="personal"] .tag-dot{background:var(--peach-deep);}
  .tabs button[data-scope="group"] .tag-dot{background:var(--blue-deep);}
  .tabs button[data-scope="compare"] .tag-dot{background:var(--pink-deep);}
  .tabs button[data-scope="candidates"] .tag-dot{background:var(--mint-deep);}
  .tabs button[data-scope="map"] .tag-dot{background:var(--gold);}
  .tabs button[data-scope="expenses"] .tag-dot{background:var(--pink-deep);}

  .spacer{flex:1;}
  .ghost-btn{
    border:2px solid var(--ink); background:var(--paper); border-radius:999px; padding:8px 16px;
    font-size:13px; font-weight:700; font-family:var(--font-display); color:var(--ink);
    display:flex; align-items:center; gap:6px;
  }
  .ghost-btn:hover{background:var(--ink); color:var(--paper);}
  .primary-btn{
    border:none; background:var(--peach-deep); color:#fff; border-radius:999px; padding:9px 18px;
    font-size:13px; font-weight:700; font-family:var(--font-display); box-shadow:var(--shadow);
  }
  .primary-btn:hover{background:#C0813C;}
  .primary-btn.coral{background:var(--blue-deep);}
  .primary-btn.coral:hover{background:#5893AF;}
  .primary-btn.mint{background:var(--mint-deep);}
  .primary-btn.mint:hover{background:#5F9C71;}

  .hint-bar{font-size:12px; color:var(--ink-soft); margin:2px 0 14px; display:flex; gap:6px; align-items:center;}
  .hint-bar svg{flex:none;}

  /* ---------- Calendar (desktop grid) ---------- */
  .board-wrap-desktop{
    border:2px solid var(--ink); border-radius:16px; background:var(--paper); overflow:hidden; box-shadow:var(--shadow);
  }
  .board-scroll{overflow-x:auto;}
  .board{display:flex; min-width:100%;}
  .time-rail{
    width:56px; flex:none; position:sticky; left:0; background:var(--paper); border-right:1.5px solid var(--ink); z-index:3;
  }
  .time-rail .rail-head{height:64px; border-bottom:1.5px solid var(--ink);}
  .time-slot-label{
    height:60px; font-size:10.5px; color:var(--ink-soft); font-family:var(--font-display); font-weight:600;
    padding-top:2px; padding-right:6px; text-align:right; border-bottom:1px dashed var(--line);
  }
  .day-col{width:220px; flex:none; border-right:1px solid var(--line); position:relative;}
  .day-col:last-child{border-right:none;}
  .day-head{
    height:64px; border-bottom:1.5px solid var(--ink); display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:var(--paper-2); position:sticky; top:0; z-index:2;
  }
  .day-head .dow{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); font-weight:700;}
  .day-head .dnum{font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--ink);}
  .day-body{position:relative;}
  .grid-line{position:absolute; left:0; right:0; height:1px; background:var(--line); pointer-events:none;}
  .grid-line.hour{background:var(--line-strong);}
  .day-body.drag-over{background:rgba(110,168,201,0.12);}
  .lane-divider{position:absolute; top:0; bottom:0; left:50%; width:0; border-left:1px dashed var(--line-strong); pointer-events:none;}
  .lane-caption{position:absolute; top:2px; font-size:9.5px; font-weight:700; font-family:var(--font-display);
    letter-spacing:.06em; color:var(--ink-soft); text-transform:uppercase; pointer-events:none; z-index:1;}

  .item-card{
    position:absolute; border-radius:11px; padding:6px 8px 7px;
    border:1.8px solid var(--ink); cursor:grab; overflow:hidden; box-shadow:var(--shadow);
    transition:box-shadow .15s ease, transform .1s ease;
  }
  .item-card:active{cursor:grabbing; transform:scale(1.01);}
  .item-card.dragging{opacity:.35;}
  .item-card[draggable="false"]{cursor:pointer;}
  .item-card.personal{background:var(--card-personal); border-left:5px solid var(--peach-deep);}
  .item-card.group{background:var(--card-group); border-left:5px solid var(--blue-deep);}
  .item-card.other{background:var(--card-other); border-left:5px dashed var(--peach-deep); opacity:.9;}
  .item-card.other.half{background:repeating-linear-gradient(135deg, var(--card-other) 0 8px, var(--paper-2) 8px 16px); opacity:.75;}
  .item-card.other.half .item-title{font-style:italic; color:var(--ink-soft);}
  .item-card.conflict{outline:2px dashed var(--pink-deep); box-shadow:0 0 0 3px rgba(221,133,120,0.25);}
  .item-time{font-family:var(--font-display); font-size:10px; font-weight:700; color:var(--ink-soft);}
  .item-title{font-size:12px; font-weight:700; line-height:1.25; margin-top:1px; word-break:break-word;}
  .item-loc{font-size:10px; color:var(--ink-soft); margin-top:2px; display:flex; gap:3px; align-items:center;}
  .item-photos{display:flex; gap:3px; margin-top:5px;}
  .item-photos img{width:22px; height:22px; object-fit:cover; border-radius:3px; border:1px solid var(--ink);}
  .item-owner{
    position:absolute; top:5px; right:5px; font-size:8.5px; font-weight:700; color:#fff; background:var(--ink);
    padding:1px 5px; border-radius:999px; font-family:var(--font-display); white-space:nowrap;
  }
  .item-tag{
    display:inline-block; margin-top:3px; font-size:8.5px; font-weight:700; color:var(--ink);
    background:var(--paper-2); border:1px solid var(--ink); padding:1px 6px; border-radius:999px;
    font-family:var(--font-display); white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis;
  }
  .color-swatches{display:flex; gap:6px; flex-wrap:wrap; padding-top:2px;}
  .color-swatch{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--ink); padding:0; position:relative;
  }
  .color-swatch[data-color=""]{background:repeating-linear-gradient(45deg,#fff 0 3px,#eee 3px 6px);}
  .color-swatch.on::after{
    content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:12px; text-shadow:0 0 2px rgba(0,0,0,.6);
  }
  .item-card.group .item-owner{background:var(--blue-deep);}
  .item-card.other .item-owner{background:var(--peach-deep);}
  .conflict-badge{
    position:absolute; top:5px; left:5px; font-size:9.5px; font-weight:700; color:#fff; background:var(--pink-deep);
    padding:1px 5px; border-radius:999px; font-family:var(--font-display);
  }
  .join-btn{
    margin-top:5px; font-size:9.5px; font-weight:700; border:1px solid var(--ink); background:#fff; border-radius:999px;
    padding:2px 7px; font-family:var(--font-display);
  }
  .join-btn.joined{background:var(--blue-deep); color:#fff; border-color:var(--blue-deep);}
  .item-card .join-btn.mini{position:absolute; right:4px; bottom:4px; margin:0; width:22px; height:22px; padding:0; border-radius:50%; font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center;}
  .item-card .join-btn.mini.joined{background:var(--blue-deep); color:#fff; border:1px solid var(--blue-deep);}
  .item-card.joined-me{box-shadow:0 0 0 3px var(--blue-deep), var(--shadow); border-color:var(--blue-deep);}
  .join-block{background:var(--paper-2,#f5efe3); border:1.5px dashed var(--ink); border-radius:12px; padding:8px 10px; font-size:13px;}
  .join-block .ghost-btn{margin-top:6px;}
  .map-block{margin-top:6px;}
  .cand-nav{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:6px; overflow-x:auto; padding:8px 4px; margin-bottom:6px; background:var(--paper,#fdfcf8); border-bottom:1.5px dashed var(--line-strong); scrollbar-width:thin;}
  .cand-nav-all{flex:none; font-size:12.5px; margin-right:2px; white-space:nowrap;}
  .cand-nav-chip{flex:none; display:inline-flex; align-items:center; gap:5px; border:1.5px solid var(--ink); border-radius:999px; padding:4px 11px; font-size:12.5px; font-weight:700; background:#fff; cursor:pointer; white-space:nowrap; font-family:inherit; color:inherit;}
  .cand-nav-chip b{background:var(--ink); color:#fff; border-radius:999px; min-width:18px; padding:0 5px; text-align:center; font-size:11px;}
  .cand-sec{scroll-margin-top:64px;}
  .cand-sec.flash{animation:candflash 1.2s ease;}
  @keyframes candflash{0%{background:rgba(224,175,46,.55);}100%{background:transparent;}}
  .br-row{display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 0; border-bottom:1px dashed rgba(64,49,31,.25);}
  .br-row .br-n{flex:none; font-size:12px; font-weight:700; width:46px;}
  .br-row input{padding:6px 8px; border:1.5px solid var(--ink); border-radius:10px; font-size:13px; background:#fff; font-family:inherit;}
  .br-row .br-addr{flex:1 1 170px; min-width:140px;} .br-row .br-url{flex:1 1 150px; min-width:120px;}
  .note-a{color:#2a6fb0; text-decoration:underline; word-break:break-all;}
  .note-links{display:flex; flex-direction:column; gap:3px; margin-top:5px; font-size:12.5px;}
  .note-links a{color:#2a6fb0; word-break:break-all;}
  .color-custom{position:relative; display:inline-flex; width:28px; height:28px; border-radius:50%; border:2px dashed var(--ink); align-items:center; justify-content:center; font-size:14px; cursor:pointer; background:#fff; overflow:hidden; vertical-align:middle;}
  .color-custom input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; padding:0; border:none;}
  .lab-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .lab-chip{border:1.5px solid var(--ink); border-radius:999px; padding:3px 11px; font-size:12px; font-weight:700; cursor:pointer;}
  .lab-note{font-size:12px; color:var(--ink-soft);}
  .lab-dot{display:inline-block; width:11px; height:11px; border-radius:50%; border:1.5px solid var(--ink); margin-right:6px; vertical-align:-1px;}
  .cc-grouphead{flex:none; align-self:center; padding:4px 10px; border:1.5px solid var(--ink); border-radius:999px; font-size:12px; font-weight:700; background:#fff; white-space:nowrap;}
  .tr-box{border:1.5px dashed var(--ink); border-radius:12px; padding:8px; margin-bottom:12px;}
  .tr-row{display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 0; border-bottom:1px dashed rgba(64,49,31,.25);}
  .tr-row:last-of-type{border-bottom:none;}
  .tr-row select,.tr-row input[type=text],.tr-row input[type=number]{padding:6px 8px; border:1.5px solid var(--ink); border-radius:10px; font-size:13px; background:#fff; font-family:inherit;}
  .tr-row .tr-label{flex:1 1 140px; min-width:120px;} .tr-row .tr-mins{width:74px;} .tr-row .tr-cost{width:90px;}
  .tr-pick{font-size:12px; white-space:nowrap;}
  .tr-del{border:none; background:transparent; font-size:16px; cursor:pointer; color:#c0504a;}
  .tr-view{display:flex; flex-direction:column; gap:6px; margin:6px 0;}
  .tr-vrow{display:flex; gap:8px; align-items:center; border:1.5px solid var(--ink); border-radius:12px; padding:6px 10px; background:#fff; font-size:13px;}
  .tr-vrow.on{background:#EAF6EF;} .tr-vi{font-size:18px;} .tr-vt{flex:1;} .tr-on{font-size:11px; font-weight:700; color:#2f7a55;}
  .item-card.transit{border-style:dashed;}
  .item-tr{font-size:10.5px; line-height:1.3; margin-top:2px; font-weight:700;}
  .bk-scroll{position:relative;}
  .bk-arr{display:none; position:absolute; top:50%; transform:translateY(-50%); z-index:5; width:30px; height:30px; border-radius:50%; border:1.8px solid var(--ink); background:#fff; font-size:18px; line-height:1; cursor:pointer; align-items:center; justify-content:center; box-shadow:var(--shadow);}
  .bk-arr.l{left:-6px;} .bk-arr.r{right:-6px;}
  @media (hover:hover) and (pointer:fine){ .bk-arr{display:flex;} }
  .map-box{width:100%; height:min(62vh,520px); min-height:300px; border:2px solid var(--ink); border-radius:14px; overflow:hidden; background:#dfe6e0; position:relative; z-index:0;}
  .map-pin{width:26px; height:26px; border-radius:50%; border:2px solid #40311F; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.45); font-family:inherit;}
  .map-pin.approx{border-style:dashed; opacity:.8;}
  .map-pin.group{background:#5B86A8;} .map-pin.cand{background:#D9A93A; color:#40311F;} .map-pin.personal{background:#E39A7B;}
  .plan-bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:8px 0 10px;}
  .plan-chip{border:2px solid #40311F; border-radius:14px 10px 14px 9px; padding:4px 12px; background:#fff; font-weight:800; font-size:13px; cursor:pointer; color:#40311F; user-select:none;}
  .plan-chip input{display:none;}
  .plan-chip.on{background:var(--pc); color:#fff;}
  .plan-chip.on::before{content:'✓ ';}
  .plan-hint{font-size:11px; opacity:.65;}
  .plan-a{box-shadow:inset 6px 0 0 #E4572E !important;}
  .plan-b{box-shadow:inset 6px 0 0 #2E86AB !important;}
  .cand-used{opacity:.7; font-weight:600;}

  .leaflet-control-attribution{background:rgba(255,255,255,.8); margin:0; padding:0 5px; font-size:10px; color:#333;} .leaflet-control-attribution a{color:#0078a8; text-decoration:none;}

  .photo-row{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}

  .cv-dow span{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:12px; letter-spacing:.14em; color:var(--ink); padding-bottom:12px;}
  .cv-rule{height:0; border-top:1.5px solid var(--ink); margin:0 0 10px; opacity:.85;}
  .cv-day{position:relative; padding:9px 0; font-family:'Space Grotesk', sans-serif; font-size:17px; font-weight:400; color:var(--ink);}
  .cv-day span{position:relative;}
  .cv-day.in-trip{background:rgba(224,175,46,.3);}
  .cv-day.is-start{border-radius:999px 0 0 999px;}
  .cv-day.is-end{border-radius:0 999px 999px 0;}
  .cv-day.is-start.is-end{border-radius:999px;}
  .cv-day.is-start span, .cv-day.is-end span{font-weight:700;}
  .cv-circle{position:absolute; left:-4px; top:2px; width:calc(100% + 8px); height:calc(100% - 4px); color:var(--ink); pointer-events:none;}
  .cv-info{padding-top:4px; padding-right:130px; min-height:96px;}
  .cv-dest{font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:.03em; text-transform:uppercase; line-height:1.15; word-break:break-word;}
  .cv-sub{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.06em; margin-top:6px;}
  .cv-count{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  .cv-pin{position:absolute; right:16px; bottom:16px; transform:rotate(-8deg);}
  .cv-tag{
    background:#fff; border:1px solid #cfc9bb; padding:12px 14px 9px 24px; min-width:104px;
    font-family:Georgia,'Noto Serif TC',serif; text-transform:uppercase; font-size:12.5px; line-height:1.35; letter-spacing:.04em;
    clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px); box-shadow:2px 3px 0 rgba(64,49,31,.12);
  }
  .cv-pin i{position:absolute; left:6px; top:6px; width:11px; height:11px; border-radius:50%; background:var(--gold); border:1.5px solid var(--ink); z-index:2;}
  @media(max-width:640px){ .cv-card{padding:20px 16px 24px;} .cv-info{padding-right:0; padding-bottom:70px;} }

  /* ===== cover landing screen (torn paper calendar) ===== */
  :root{ --cover-blue:#6A9DB8; }
  .cover-screen{
    position:fixed; inset:0; overflow:auto; z-index:50; display:flex; justify-content:center; align-items:flex-start;
    padding:64px 18px 60px;
    background:#8DB0C2 repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 28px, transparent 28px 56px);
  }
  .cover-screen.has-bg{background-size:cover; background-position:center; background-repeat:no-repeat;}
  .cover-tools{position:fixed; top:14px; right:14px; display:flex; gap:8px; z-index:60;}
  .cover-tool{
    border:none; background:rgba(255,255,255,.85); color:#3b3a37; border-radius:999px; padding:8px 14px;
    font-size:12.5px; font-weight:700; font-family:var(--font-display); box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .cp-stage{position:relative; width:100%; max-width:420px; margin:auto;}
  .cp-shadow{filter:drop-shadow(2px 5px 7px rgba(0,0,0,.28));}

  .cp-tape{
    position:absolute; left:-8px; top:-12px; width:136px; height:36px; transform:rotate(-7deg); z-index:3;
    background:rgba(236,240,234,.7); backdrop-filter:blur(1px);
    clip-path:polygon(0 0,4% 12%,0 25%,4% 38%,0 50%,4% 62%,0 75%,4% 88%,0 100%,100% 100%,96% 88%,100% 75%,96% 62%,100% 50%,96% 38%,100% 25%,96% 12%,100% 0);
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));
  }
  .cp-month + .cp-month{margin-top:34px;}
  .cp-month-title{font-weight:800; font-size:clamp(34px,10vw,46px); text-align:center; letter-spacing:-.01em; margin:0 0 24px;}
  .cp-dow, .cp-grid{display:grid; grid-template-columns:repeat(7,1fr); text-align:center;}
  .cp-dow span{font-weight:700; font-size:16px; padding-bottom:10px;}
  .cp-dow span:first-child{color:var(--cover-blue);}
  .cp-rule{border-top:1px solid #7d7c76; margin-bottom:6px;}
  .cp-day{position:relative; padding:11px 0; font-size:17px; font-weight:500;}
  .cp-day span{position:relative;}
  .cp-day.sun{color:var(--cover-blue);}
  .cp-day.in-trip{background:rgba(106,157,184,.2);}
  .cp-day.is-start{border-radius:999px 0 0 999px;}
  .cp-day.is-end{border-radius:0 999px 999px 0;}
  .cp-day.is-start.is-end{border-radius:999px;}
  .cp-day.is-start span, .cp-day.is-end span{font-weight:800;}
  .cp-circle{position:absolute; left:-5px; top:3px; width:calc(100% + 10px); height:calc(100% - 6px); color:var(--cover-blue); pointer-events:none;}
  .cp-year{text-align:center; color:var(--cover-blue); letter-spacing:.24em; font-weight:700; font-size:20px; margin-top:22px;}
  .cp-dest{text-align:center; font-weight:800; text-transform:uppercase; letter-spacing:.08em; font-size:15px; margin-top:16px; word-break:break-word;}
  .cp-range{text-align:center; font-size:12px; color:#6b6a65; margin-top:4px; letter-spacing:.04em;}
  .cp-enter{
    display:block; margin:22px auto 0; border:1.8px solid #3b3a37; background:transparent; border-radius:999px; padding:10px 26px;
    font-weight:700; font-family:inherit; font-size:14px; color:#3b3a37; cursor:pointer;
  }
  .cp-enter:hover{background:#3b3a37; color:#fff;}

  .cp-tape{display:none;}
  .cp-month-title{margin-top:-8px;}
  .cp-day.in-trip span{font-weight:800;}

  /* ================= v2 ================= */
  .paper-head{margin-top:46px;}
  .ph-wrap{position:relative; max-width:780px; margin:0 auto;}
  .ph-shadow{position:absolute; inset:0; filter:drop-shadow(0 4px 6px rgba(64,49,31,.3));}
  .ph-paper{position:absolute; inset:0;}
  .ph-clip{position:absolute; left:50%; top:-36px; width:132px; transform:translateX(-50%); z-index:3; filter:drop-shadow(0 2px 2px rgba(64,49,31,.35)); pointer-events:none;}
  .ph-body{position:relative; z-index:2; padding:56px 70px 30px; text-align:center;}
  .ph-eyebrow{font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:.3em; font-size:11px; color:var(--blue-deep); margin-bottom:6px;}
  .ph-title{font-family:var(--font-display); font-weight:800; font-size:clamp(24px,5vw,38px); line-height:1.15; color:var(--ink); display:flex; justify-content:center; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .ph-title .edit-title{border:none; background:none; font-size:12px; color:var(--ink-soft); text-decoration:underline; font-family:var(--font-body); padding:2px 4px;}
  .ph-meta{display:flex; justify-content:center; gap:8px 20px; flex-wrap:wrap; margin-top:10px; font-size:12.5px; color:var(--ink-soft);}
  .ph-meta b{color:var(--ink); font-family:var(--font-display);}
  .ph-stk{position:absolute; top:52px; right:30px; margin:0;}
  .paper-head.custom .ph-wrap{max-width:560px;}
  .paper-head{margin-top:8px;}
  .ph-img{display:block; width:100%; height:auto;}
  .paper-head.custom .ph-body{position:absolute; left:11%; right:13%; top:25%; bottom:9%; padding:0; display:flex; flex-direction:column; justify-content:center; align-items:center;}
  .paper-head.custom .ph-title{font-size:clamp(16px,3.6vw,28px);}
  .paper-head.custom .ph-meta{font-size:clamp(9px,1.6vw,12px); margin-top:4px;}
  .paper-head.custom .ph-eyebrow{font-size:clamp(8px,1.4vw,11px); margin-bottom:2px;}
  .paper-head.custom .ph-stk{top:2%; right:0; width:clamp(30px,6vw,46px); height:clamp(30px,6vw,46px);}
  @media(max-width:640px){ .ph-body{padding:52px 22px 24px;} .ph-stk{top:46px; right:12px; width:38px; height:38px;} }

  .day-head .dow{letter-spacing:.16em;}
  .day-head .dnum{font-size:15px; font-weight:700; color:var(--ink);}
  .dwk{font-size:10px; font-weight:500; color:var(--ink-soft); margin-left:4px;}
  .day-page-head{flex-direction:column; align-items:flex-start; gap:2px;}
  .day-pill{display:flex; flex-direction:column; align-items:center; line-height:1.25;}
  .day-pill .pdate{display:block; margin:0;}

  /* rows layout (days stacked, time runs horizontally) */
  .board-wrap-rows{display:block;}
  .rows-scroll{overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
  .rows-board{width:max-content; min-width:100%;}
  .rows-headrow{display:flex;}
  .rows-corner{width:76px; flex:none; position:sticky; left:0; z-index:25; background:rgba(253,252,248,.94); border-bottom:2px solid var(--blue-deep);}
  .rows-hours{display:flex; border-bottom:2px solid var(--blue-deep);}
  .rows-hour{width:84px; flex:none; text-align:left; padding:8px 0 6px 4px; font-family:'Space Grotesk',monospace; font-weight:700; font-size:12px; color:var(--blue-deep);}
  .rows-day{display:flex; border-bottom:1px solid var(--line-strong);}
  .rows-label{width:76px; flex:none; position:sticky; left:0; z-index:25; background:rgba(253,252,248,.94); border-right:2px solid var(--blue-deep);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  .rows-label .dow{font-family:'Space Grotesk',monospace; font-weight:700; font-size:11px; letter-spacing:.16em; color:var(--blue-deep);}
  .rows-label .dnum{font-family:'Space Grotesk',monospace; font-weight:700; font-size:15px; color:var(--ink);}
  .rows-day .day-body{flex:none;}
  .grid-line.vline{right:auto; width:1px; height:auto; top:0; bottom:0; background:#EAE6DA;}
  .vlabel{position:absolute; bottom:2px; font-family:'Space Grotesk',monospace; font-weight:700; font-size:9px; color:var(--blue-deep); opacity:.7; pointer-events:none;}
  .lane-divider.h{top:50%; bottom:auto; left:0; right:0; width:auto; border-left:none; border-top:1px dashed var(--line-strong);}
  .resize-handle.h{left:auto; top:0; bottom:0; right:0; width:11px; height:auto; cursor:ew-resize; align-items:center; justify-content:flex-end;}
  .resize-handle.h span{width:3.5px; height:26px; margin:0 2px 0 0;}

  /* stickers */
  .sticker{position:absolute; z-index:30; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; line-height:0;}
  .sticker img{width:100%; height:auto; display:block; pointer-events:none; -webkit-touch-callout:none; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));}
  .sticker.sel{outline:1.5px dashed var(--blue-deep); outline-offset:2px;}
  .st-del,.st-resize,.st-rot{display:none;}
  .sticker.sel .st-rot{display:flex; position:absolute; top:-13px; left:-13px; width:26px; height:26px; border-radius:50%; background:var(--blue-deep); color:#fff; border:2px solid #fff; align-items:center; justify-content:center; font-size:14px; line-height:1; padding:0; touch-action:none; cursor:grab;}
  .sticker.sel .st-del{display:flex; position:absolute; top:-13px; right:-13px; width:26px; height:26px; border-radius:50%; background:var(--ink); color:#fff; border:none; align-items:center; justify-content:center; font-size:11px; line-height:1; padding:0;}
  .sticker.sel .st-resize{display:block; position:absolute; right:-10px; bottom:-10px; width:20px; height:20px; border-radius:50%; background:var(--blue-deep); border:2px solid #fff; cursor:nwse-resize; touch-action:none;}
  .st-paste{min-height:110px; border:2px dashed var(--line-strong); border-radius:14px; padding:12px; background:#fff; font-size:13px; color:var(--ink); outline:none;}
  .st-paste:empty:before{content:attr(data-ph); color:var(--ink-soft);}
  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; z-index:300; box-shadow:0 4px 14px rgba(0,0,0,.3); max-width:90vw; text-align:center;}

  /* ---------- v5: compact cards, one-board mobile ---------- */
  .item-card{padding:3px 6px;}
  .item-title{font-size:10.5px; line-height:1.2;}
  .item-time{font-size:9px;}
  .rows-day .item-photos{display:none;}
  .sticker.other{z-index:29;}
  .cc-tools{display:flex; gap:6px; margin-top:6px;}
  .cc-tools button{flex:1; font-size:11px; padding:4px 6px; border-radius:10px; border:1px solid var(--line-strong); background:#fff; color:var(--ink-soft);}
  .cc-tools .cc-del{color:#C0504A;}
  .candidate-actions button.edit-btn{background:#fff; color:var(--ink); border:1.5px solid var(--line-strong);}
  .candidate-actions button.remove-btn{color:#C0504A;}
  .modal-actions .danger-btn{color:#C0504A; border-color:#C0504A;}
  @media(max-width:640px){
    .day-col{width:148px;}
    .time-rail{width:44px; background:var(--paper); z-index:6;}
    .time-slot-label{font-size:10.5px;}
    .board-scroll{-webkit-overflow-scrolling:touch;}
  }

  .av-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .av-opt{border:2px solid var(--line-strong); border-radius:50%; overflow:hidden; aspect-ratio:1; padding:0; background:#fff; cursor:pointer;}
  .av-opt.on{border-color:var(--blue-deep); box-shadow:0 0 0 3px rgba(90,166,160,.35);}

<script>
(function(){
"use strict";

/* ---------------- storage: Google Apps Script + Drive file for the team ---------------- */
/* 👇 部署前淨係改呢行（睇返教學）。留空 = 只儲存喺呢部機（試玩用）。 */
// 預設頭像（俾隊員直接揀）。放入圖片嘅 data URI（建議 160×160 正方形），例如：
// const AVATAR_PRESETS = ['data:image/png;base64,....', 'data:image/png;base64,....'];
const AVATAR_PRESETS = [];
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwMLtoa6qB6ceShjSu7NJQuMVKF2icCltrFGBQkbKv2isdeG_CnxhRrrFgfqQklEa4Z0Q/exec';   // 貼上 Apps Script 部署後嘅網址（https://script.google.com/macros/s/.../exec）

let DB = false, lastVer = null;
const sh = { docs:new Map(), trip:null, g:[], c:[], pl:[], pub:{}, mem:[], st:[], sti:{}, av:{}, ren:{}, b:[], x:[], ready:false, v:0 };
const known = {};
const itemCache = new Map();
let _warnAt = 0;

function lsGet(k){ try{ const v = window.localStorage.getItem('tp3:'+k); return v==null ? null : JSON.parse(v); }catch(e){ return null; } }
function lsSet(k, v){
  try{ if(v==null) window.localStorage.removeItem('tp3:'+k); else window.localStorage.setItem('tp3:'+k, JSON.stringify(v)); return true; }
  catch(e){ return false; }
}
function clone(x){ return x==null ? x : JSON.parse(JSON.stringify(x)); }
function hex(s){ return Array.from(new TextEncoder().encode(String(s))).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,120); }
function safeId(s){ return String(s).replace(/[^A-Za-z0-9_\-]/g,'_'); }

let lastErr = '', netBad = false;
async function callScript(opts, query){
  let r, txt;
  try{ r = await fetch(SCRIPT_URL + (query||''), opts); txt = await r.text(); }
  catch(e){ lastErr = '連唔到 Google 程式（網絡或網址錯）：' + (e && e.message || e); netBad = true; updateSyncBadge(); throw e; }
  if(netBad){ netBad = false; updateSyncBadge(); }
  let j = null;
  try{ j = JSON.parse(txt); }catch(e){}
  if(!r.ok || j===null){
    lastErr = j===null ? '回應唔係資料（通常係部署時「誰可以存取」冇揀「任何人」，或網址唔啱）' : '伺服器回應 ' + r.status;
    throw new Error('bad response');
  }
  if(j && j.error){ lastErr = '程式出錯：' + j.error; throw new Error(j.error); }
  return j;
}
let _q = Promise.resolve();
function enqueue(fn){ const p = _q.then(fn, fn); _q = p.catch(()=>{}); return p; }

function rebuild(docs, trip){
  const bk = [], xp = [], g = [], c = [], pl = [], pubs = {}, mem = [], st = [], sti = {}, avs = {}, ren = {};
  docs.forEach((x, id)=>{
    if(!x || !x.j) return;
    let obj;
    const hit = itemCache.get(id);
    if(hit && hit.j===x.j) obj = hit.obj;
    else{ try{ obj = JSON.parse(x.j); }catch(e){ return; } itemCache.set(id, { j:x.j, obj }); }
    const rec = { o: x.o||0, obj };
    if(id.startsWith('g_')) g.push(rec);
    else if(id.startsWith('c_')) c.push(rec);
    else if(id.startsWith('pl_')) pl.push(rec);
    else if(id.startsWith('b_')) bk.push(rec);
    else if(id.startsWith('x_')) xp.push(rec);
    else if(id.startsWith('p_')) (pubs[x.name] = pubs[x.name] || []).push(rec);
    else if(id.startsWith('m_')) mem.push(obj);
    else if(id.startsWith('s_')) st.push(obj);
    else if(id.startsWith('i_')){ if(obj && obj.id) sti[obj.id] = obj.img; }
    else if(id.startsWith('a_')){ if(obj && obj.name) avs[obj.name] = obj.img || ''; }
    else if(id.startsWith('r_')){ if(obj && obj.from && obj.to) ren[obj.from] = obj.to; }
  });
  const srt = a => a.sort((p,q)=>p.o-q.o).map(r=>r.obj);
  sh.docs = docs; sh.trip = trip; sh.g = srt(g); sh.c = srt(c); sh.pl = srt(pl);
  sh.pub = {}; Object.keys(pubs).forEach(n=>{ sh.pub[n] = srt(pubs[n]); });
  sh.b = srt(bk); sh.x = srt(xp); sh.mem = mem; sh.st = st; sh.sti = sti; sh.av = avs; sh.ren = ren;
  sh.ready = true; sh.v++;
}

/* ---- 本機快取：下次開頁即時顯示上次資料，背景先更新 ---- */
function idbOpen(){
  return new Promise((res, rej)=>{
    try{
      const r = indexedDB.open('tp-cache', 1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore('kv'); };
      r.onsuccess = ()=> res(r.result);
      r.onerror = ()=> rej(r.error);
    }catch(e){ rej(e); }
  });
}
async function idbGet(k){
  try{
    const db = await idbOpen();
    return await new Promise(res=>{ const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = ()=> res(q.result || null); q.onerror = ()=> res(null); });
  }catch(e){ return null; }
}
async function idbSet(k, v){
  try{
    const db = await idbOpen();
    await new Promise(res=>{ const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = ()=> res(); tx.onerror = ()=> res(); tx.onabort = ()=> res(); });
  }catch(e){}
}
function applyData(data){
  const docs = new Map();
  Object.keys(data.docs || {}).forEach(id=>{ docs.set(id, data.docs[id]); });
  let trip = null;
  if(data.trip && data.trip.j){ try{ trip = JSON.parse(data.trip.j); }catch(e){} }
  // 離線期間未同步嘅改動（outbox）疊返上去，咁就唔會被舊資料蓋走
  Object.keys(_outbox).forEach(k=>{
    if(k==='trip'){ try{ trip = JSON.parse(_outbox[k].j); }catch(e){} }
    else if(k.indexOf('docs/')===0){ const id = k.slice(5); if(_outbox[k]===null) docs.delete(id); else docs.set(id, _outbox[k]); }
  });
  rebuild(docs, trip);
  lastVer = data.ver || null;
}
async function refreshShared(force){
  if(!DB) return;
  try{
    if(!force && sh.ready){
      const v = await callScript({}, '?a=ver&t=' + Date.now());
      if((v.ver||null)===lastVer) return;
    }
    const data = (await callScript({}, '?t=' + Date.now())) || {};
    applyData(data);
    idbSet('data:' + SCRIPT_URL, data);
  }catch(e){ console.error('refresh failed', e); if(!sh.ready) throw e; }
}

/* ---- 離線寫入：所有改動先入本機 outbox，再背景同步；上唔到網就留低，上到網自動補返 ---- */
let _outbox = {}, _syncing = false, _retryT = null, _retryN = 0, _offlineToasted = false;
async function loadOutbox(){
  const o = await idbGet('outbox:' + SCRIPT_URL);
  _outbox = (o && o.ch && typeof o.ch==='object') ? o.ch : {};
}
function saveOutbox(){ return idbSet('outbox:' + SCRIPT_URL, { ch:_outbox }); }
function pendingCount(){ return Object.keys(_outbox).length; }
function patchDocs(changes){
  Object.assign(_outbox, changes);
  saveOutbox();
  updateSyncBadge();
  scheduleFlush(150);
  return Promise.resolve({ queued:true });
}
function scheduleFlush(ms){
  if(_retryT) clearTimeout(_retryT);
  _retryT = setTimeout(flushOutbox, ms);
}
async function flushOutbox(){
  if(_syncing) return;
  if(!pendingCount()){ updateSyncBadge(); return; }
  _syncing = true; updateSyncBadge();
  const sent = Object.assign({}, _outbox);
  let ok = false;
  try{
    const r = await enqueue(()=> callScript({ method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ changes: sent }) }));
    Object.keys(sent).forEach(k=>{ if(_outbox[k]===sent[k]) delete _outbox[k]; });
    await saveOutbox();
    ok = true; _retryN = 0; _offlineToasted = false;
    if(r && r.prev !== undefined && r.prev === lastVer && r.ver && !pendingCount()) lastVer = r.ver;
    else lastVer = null;          // 有其他人改過／離線期間有變 → 下一次輪詢會重新下載
  }catch(e){
    console.error('sync failed, kept in outbox', e);
    if(!_offlineToasted){ _offlineToasted = true; toast('暫時同步唔到，改動已儲存喺呢部機，上到網會自動同步'); }
  }finally{
    _syncing = false; updateSyncBadge();
  }
  if(ok){ if(pendingCount()) scheduleFlush(300); else refreshShared(true).then(()=>{ try{ if(typeof afterBackgroundSync==='function') afterBackgroundSync(); }catch(e){} }).catch(()=>{}); }
  else{ _retryN++; scheduleFlush(Math.min(30000, 3000 * _retryN)); }
}
function updateSyncBadge(){
  let el = document.getElementById('sync-badge');
  const n = pendingCount();
  const off = netBad || (typeof navigator!=='undefined' && navigator.onLine===false);
  if(!DB || (!off && !n)){ if(el) el.remove(); return; }
  if(!el){ el = document.createElement('div'); el.id = 'sync-badge'; document.body.appendChild(el); el.onclick = ()=>{ if(pendingCount()) flushOutbox(); }; }
  el.className = off ? 'off' : 'syncing';
  el.textContent = off
    ? (n ? '📴 離線 · ' + n + ' 項改動待同步' : '📴 離線 · 顯示上次同步嘅版本')
    : '⟳ 同步緊 ' + n + ' 項…';
}
window.addEventListener('online', ()=>{ netBad = false; updateSyncBadge(); if(pendingCount()) flushOutbox(); else if(DB) refreshShared(true).catch(()=>{}); });
window.addEventListener('offline', ()=>{ updateSyncBadge(); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && DB && pendingCount()) scheduleFlush(200); });

async function revertFromServer(){
  try{
    await refreshShared(true);
    groupItems = (await sget('group-items', true)) || []; plans = (await sget('plans', true)) || [];
    candidates = (await sget('candidates', true)) || [];
  bookings = (await sget('bookings', true)) || [];
  expenses = (await sget('expenses', true)) || [];
    trip = (await sget('trip-config', true)) || trip;
    await loadPublicOthers();
    renderApp();
  }catch(e){}
}

let DEMO = false;
function isPreviewEnv(){ try{ return window.self !== window.top || !!window.claude; }catch(e){ return true; } }
async function initStorage(){
  if(!SCRIPT_URL) return 'local';
  if(isPreviewEnv()){ DEMO = true; return 'demo'; }
  DB = true;
  await loadOutbox();
  const cached = await idbGet('data:' + SCRIPT_URL);
  if(cached && typeof cached==='object' && cached.docs){
    applyData(cached);                       // 即時有內容（離線都開到）
    refreshShared().catch(()=>{});           // 背景查版本，有更新先重新下載
    if(pendingCount()) scheduleFlush(800);   // 上次離線未同步嘅改動，上到網就補返
    updateSyncBadge();
    return 'db';
  }
  try{ await refreshShared(true); if(pendingCount()) scheduleFlush(800); return 'db'; }
  catch(e){ return 'fail'; }
}

let _pWriteAt = 0;
async function loadPersonalItems(){
  const pre = 'u_' + hex(myName) + '_';
  const rem = [];
  sh.docs.forEach((x, id)=>{
    if(id.startsWith(pre) && x && x.j){ try{ rem.push({ o:x.o||0, obj:JSON.parse(x.j) }); }catch(e){} }
  });
  rem.sort((a,b)=> a.o-b.o);
  let items = rem.map(r=>r.obj);
  known.u = new Set(Array.from(sh.docs.keys()).filter(i=>i.startsWith(pre)));
  if(lsGet('d:ps-done') !== myName){
    // 第一次：將呢部機原本嘅個人行程併入共享（同 id 以共享為準）
    const local = lsGet('d:personal-items') || [];
    const have = new Set(items.map(i=>i.id));
    const extra = local.filter(i=> i && i.id && !have.has(i.id));
    let ok = true;
    if(extra.length){ items = items.concat(extra); ok = await sset('personal-items', items, false); }
    if(ok) lsSet('d:ps-done', myName);
  }
  return items;
}
async function sget(key, shared){
  if(DB && !shared && key==='personal-items' && myName) return loadPersonalItems();
  if(!DB || !shared) return lsGet((shared?'s:':'d:')+key);
  if(key==='trip-config') return clone(sh.trip);
  if(key==='group-items'){ known.g = new Set(Array.from(sh.docs.keys()).filter(i=>i.startsWith('g_'))); return clone(sh.g); }
  if(key==='expenses'){ known.x = new Set(Array.from(sh.docs.keys()).filter(i=>i.startsWith('x_'))); return clone(sh.x); }
  if(key==='bookings'){ known.b = new Set(Array.from(sh.docs.keys()).filter(i=>i.startsWith('b_'))); return clone(sh.b); }
  if(key==='plans'){ known.pl = new Set(Array.from(sh.docs.keys()).filter(i=>i.startsWith('pl_'))); return clone(sh.pl); }
  if(key==='candidates'){ known.c = new Set(Array.from(sh.docs.keys()).filter(i=>i.startsWith('c_'))); return clone(sh.c); }
  if(key.startsWith('public-personal:')){ const n = key.slice(16); return sh.pub[n] ? clone(sh.pub[n]) : null; }
  return null;
}
async function slist(prefix, shared){
  if(!DB) return [];
  if(shared && prefix==='public-personal:') return Object.keys(sh.pub).map(n=>'public-personal:'+n);
  return [];
}

async function syncArr(prefix, kk, arr, extra, ownOnly){
  if(!sh.ready) await refreshShared();
  arr = arr || [];
  const prev = sh.docs;
  const want = new Map();
  arr.forEach((it,i)=>{ want.set(prefix+safeId(it.id), Object.assign({}, extra, { o:i, j:JSON.stringify(it) })); });
  if(known[kk]===undefined && ownOnly){ known[kk] = new Set(Array.from(prev.keys()).filter(i=>i.startsWith(prefix))); }
  const changes = {};
  want.forEach((data, id)=>{
    const old = prev.get(id);
    if(old && old.o===data.o && old.j===data.j) return;
    changes['docs/'+id] = data;
  });
  (known[kk] || new Set()).forEach(id=>{ if(!want.has(id) && prev.has(id)) changes['docs/'+id] = null; });
  known[kk] = new Set(want.keys());
  if(!Object.keys(changes).length) return true;
  // optimistic: update local state now, sync to Google in the background
  const docs = new Map(prev);
  Object.keys(changes).forEach(k=>{ const id = k.slice(5); if(changes[k]===null) docs.delete(id); else docs.set(id, changes[k]); });
  rebuild(docs, sh.trip);
  patchDocs(changes).catch((e)=>{
    console.error('background save failed', e);
    delete known[kk];
    toast('同步失敗，已還原：' + (lastErr || '請再試'));
    revertFromServer();
  });
  return true;
}

async function sset(key, value, shared){
  if(DB && !shared && key==='personal-items' && myName){
    lsSet('d:personal-items', value);          // 本機備份
    _pWriteAt = Date.now();
    try{ const r = await syncArr('u_' + hex(myName) + '_', 'u', value, { name:myName }, true); _pWriteAt = Date.now(); return r; }
    catch(e){ console.error('personal save failed', e); toast('個人行程未能同步：' + (lastErr || '請再試')); return false; }
  }
  if(!DB || !shared) return lsSet((shared?'s:':'d:')+key, value);
  try{
    if(key==='trip-config'){
      if(!sh.trip){
        await patchDocs({ trip:{ j: JSON.stringify(value) } });
        rebuild(sh.docs, clone(value));
        return true;
      }
      rebuild(sh.docs, clone(value));
      patchDocs({ trip:{ j: JSON.stringify(value) } }).catch((e)=>{
        console.error('background save failed', e);
        toast('同步失敗，已還原：' + (lastErr || '請再試'));
        revertFromServer();
      });
      return true;
    }
    if(key==='group-items') return await syncArr('g_','g',value,{},false);
    if(key==='plans') return await syncArr('pl_','pl',value,{},false);
    if(key==='candidates') return await syncArr('c_','c',value,{},false);
    if(key==='bookings') return await syncArr('b_','b',value,{},false);
    if(key==='expenses') return await syncArr('x_','x',value,{},false);
    if(key.startsWith('public-personal:')){
      const n = key.slice(16);
      return await syncArr('p_'+hex(n)+'_','p:'+n,value,{name:n},true);
    }
    return false;
  }catch(e){
    console.error('storage set failed', e);
    if(Date.now()-_warnAt > 4000){ _warnAt = Date.now(); toast('儲存唔到：' + (lastErr || '請再試')); }
    return false;
  }
}

/* ---------------- members + share ---------------- */
function makeThumb(src, size){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const c = document.createElement('canvas'); c.width = size; c.height = size;
        const m = Math.min(img.width, img.height);
        c.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, size, size);
        resolve(c.toDataURL('image/jpeg', 0.7));
      }catch(e){ resolve(''); }
    };
    img.onerror = ()=> resolve('');
    img.src = src;
  });
}
async function adoptSharedAvatar(skipRefresh){
  // 以「較新嘅時間」為準：共享嗰張較新就採用；呢部機較新就由 registerMe 上傳
  if(!DB || !myName) return false;
  try{
    if(!skipRefresh) await refreshShared();
    const img = sh.av && sh.av[myName];
    if(!img) return false;
    const cur = sh.docs.get('m_' + hex(myName));
    let co = null;
    if(cur && cur.j){ try{ co = JSON.parse(cur.j); }catch(e){} }
    const sharedAt = (co && co.at) || 0;
    if(!mySticker || sharedAt > myStickerAt){
      if(img === mySticker && sharedAt === myStickerAt) return false;
      mySticker = img; myStickerAt = sharedAt;
      await sset('my-sticker', mySticker, false);
      await sset('my-sticker-at', myStickerAt, false);
      return true;
    }
  }catch(e){}
  return false;
}
async function followRename(){
  // 另一部機／另一個瀏覽器仲用緊舊名：自動跟返新名，唔會再變成第二個人
  if(!DB || !myName) return false;
  let n = myName, hops = 0;
  while(sh.ren && Object.prototype.hasOwnProperty.call(sh.ren, n) && sh.ren[n] && sh.ren[n]!==n && hops<6){ n = sh.ren[n]; hops++; }
  if(n===myName) return false;
  const old = myName;
  const swap = (arr)=> (arr||[]).map(x=> x===old ? n : x);
  personalItems.forEach(it=>{ if(it.owner===old) it.owner = n; if(it.participants) it.participants = swap(it.participants); });
  myName = n;
  await sset('my-name', myName, false);
  await sset('personal-items', personalItems, false);
  setTimeout(()=>{ try{ toast('你已經改名做「' + n + '」，已自動更新'); }catch(e){} }, 800);
  return true;
}
async function registerMe(){
  if(!DB || !myName) return;
  try{
    await refreshShared();
    const id = 'm_' + hex(myName);
    const aid = 'a_' + hex(myName);
    const cur = sh.docs.get(id);
    let curObj = null;
    if(cur && cur.j){ try{ curObj = JSON.parse(cur.j); }catch(e){} }
    const changes = {};
    if(!mySticker){
      // 呢部機冇頭像：只確保有隊員記錄，絕對唔會洗走共享頭像
      if(!curObj) changes['docs/'+id] = { o:0, j: JSON.stringify({ name:myName, av:'', sv:0 }) };
    }else{
      if(!myStickerAt){ myStickerAt = Date.now(); await sset('my-sticker-at', myStickerAt, false); }
      const sv = mySticker.length;
      const sharedAt = (curObj && curObj.at) || 0;
      if(myStickerAt > sharedAt || !curObj || !(sh.av && sh.av[myName])){
        const av = await makeThumb(mySticker, 96);
        changes['docs/'+id] = { o:0, j: JSON.stringify({ name:myName, av:av, sv:sv, at:myStickerAt }) };
        changes['docs/'+aid] = { o:0, j: JSON.stringify({ name:myName, img:mySticker, at:myStickerAt }) };
      }
    }
    if(!Object.keys(changes).length) return;
    await patchDocs(changes);
    const docs = new Map(sh.docs);
    Object.keys(changes).forEach(k=>{ docs.set(k.slice(5), changes[k]); });
    rebuild(docs, sh.trip);
  }catch(e){ console.error('register failed', e); }
}
function getMembers(){
  const map = new Map();
  const ghost = (n)=> n!==myName && sh.ren && Object.prototype.hasOwnProperty.call(sh.ren, n);
  (sh.mem||[]).forEach(m=>{ if(m && m.name && !ghost(m.name)) map.set(m.name, { name:m.name, av:m.av||'' }); });
  Object.keys(sh.pub||{}).forEach(n=>{ if(!map.has(n) && !ghost(n)) map.set(n, { name:n, av:'' }); });
  if(myName){
    const me = map.get(myName) || { name:myName, av:'' };
    if(mySticker) me.av = mySticker;
    map.set(myName, me);
  }
  const arr = Array.from(map.values());
  arr.sort((a,b)=> (a.name===myName ? -1 : b.name===myName ? 1 : 0));
  return arr;
}
function renderMemberBar(){
  const el = document.getElementById('member-bar');
  if(!el) return;
  const ms = getMembers();
  el.innerHTML = '<div class="mb-head"><span class="mb-title">👥 已加入隊員 · ' + ms.length + ' 人</span>' +
    '<button type="button" class="ghost-btn" id="share-btn">🔗 複製連結</button></div>' +
    '<div class="mb-list">' + ms.map(m=>
      '<div class="mb-chip' + (m.name===myName ? ' mb-me' : '') + '" data-name="' + escapeHtml(m.name) + '"><span class="mb-av">' +
      (m.av ? '<img src="' + m.av + '" alt="">' : escapeHtml(Array.from(m.name)[0] || '?')) +
      '</span><span class="mb-name">' + escapeHtml(m.name) + '</span></div>'
    ).join('') + '</div>';
  el.querySelectorAll('.mb-chip:not(.mb-me)').forEach(ch=>{
    ch.onclick = async ()=>{
      const n = ch.dataset.name;
      if(!n || !DB) return;
      if(confirm('「' + n + '」係唔係你自己？（例如你改咗名，但呢部機仲用緊舊名）\n\n確定 = 轉用「' + n + '」呢個名，合併做同一個人\n取消 = 繼續，下一步可以揀移除呢個記錄')){
        const ok = await renameMe(n);
        if(ok){ toast('已轉用「' + myName + '」'); renderApp(); }
        return;
      }

/* ---------------- image helpers ---------------- */
function fileToDataUrlResized(file, maxW, asPng){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(asPng ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function openCropModal(srcDataUrl, onDone){
  const overlay = document.createElement('div');
  overlay.className = 'overlay crop-ov';
  overlay.innerHTML = `
    <div class="modal crop-modal">
      <div class="modal-head"><h3>裁剪相片</h3><button class="modal-close">✕</button></div>
      <div class="modal-body">
        <div class="crop-viewport" id="crop-vp"><img id="crop-img" src="${srcDataUrl}"></div>
        <div class="crop-controls">
          <span style="font-size:11px;color:var(--ink-soft);">縮放</span>
          <input type="range" id="crop-zoom" min="100" max="300" value="100" style="flex:1;">
        </div>
        <div class="crop-hint">拖曳圖片調整位置，用滑桿放大縮小</div>
        <div class="modal-actions crop-actions">
          <button class="ghost-btn" id="crop-cancel">取消</button>
          <button class="primary-btn" id="crop-confirm">✓ 確定加入</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const vp = overlay.querySelector('#crop-vp');
  const img = overlay.querySelector('#crop-img');
  const zoomInput = overlay.querySelector('#crop-zoom');
  const VP = vp.clientWidth || 260;
  let natW=0, natH=0, coverScale=1, zoom=1, panX=0, panY=0;
  let dragging=false, dragStartX=0, dragStartY=0, panStartX=0, panStartY=0;

  function applyTransform(){
    const dispW = natW*coverScale*zoom;
    const dispH = natH*coverScale*zoom;
    const minX = Math.min(0, VP-dispW), maxX = 0;
    const minY = Math.min(0, VP-dispH), maxY = 0;
    panX = Math.max(minX, Math.min(maxX, panX));
    panY = Math.max(minY, Math.min(maxY, panY));
    img.style.width = dispW+'px';
    img.style.height = dispH+'px';
    img.style.transform = 'translate('+panX+'px,'+panY+'px)';
  }

  function initGeom(){
    natW = img.naturalWidth; natH = img.naturalHeight;
    if(!natW || !natH) return;
    coverScale = Math.max(VP/natW, VP/natH);
    zoom = 1;
    panX = (VP - natW*coverScale)/2;
    panY = (VP - natH*coverScale)/2;
    applyTransform();
  }
  if(img.complete && img.naturalWidth){ initGeom(); } else { img.onload = initGeom; }

  function pos(e){ return e.touches && e.touches[0] ? e.touches[0] : e; }
  function pointerDown(e){
    dragging = true;
    const p = pos(e);
    dragStartX = p.clientX; dragStartY = p.clientY;
    panStartX = panX; panStartY = panY;
  }
  function pointerMove(e){
    if(!dragging) return;
    const p = pos(e);
    panX = panStartX + (p.clientX - dragStartX);
    panY = panStartY + (p.clientY - dragStartY);
    applyTransform();
    if(e.cancelable) e.preventDefault();
  }
  function pointerUp(){ dragging = false; }

  vp.addEventListener('mousedown', pointerDown);
  vp.addEventListener('touchstart', pointerDown, {passive:true});
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('touchmove', pointerMove, {passive:false});
  window.addEventListener('mouseup', pointerUp);
  window.addEventListener('touchend', pointerUp);
  zoomInput.addEventListener('input', ()=>{ zoom = parseInt(zoomInput.value,10)/100; applyTransform(); });

  function cleanup(){
    window.removeEventListener('mousemove', pointerMove);
    window.removeEventListener('touchmove', pointerMove);
    window.removeEventListener('mouseup', pointerUp);
    window.removeEventListener('touchend', pointerUp);
    overlay.remove();
  }
  overlay.querySelector('.modal-close').onclick = cleanup;
  overlay.querySelector('#crop-cancel').onclick = cleanup;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) cleanup(); });

  overlay.querySelector('#crop-confirm').onclick = ()=>{
    const dispScale = coverScale*zoom;
    const sx = Math.max(0, -panX/dispScale);
    const sy = Math.max(0, -panY/dispScale);
    const sSize = VP/dispScale;
    const canvas = document.createElement('canvas');
    const OUT = 400;
    canvas.width = OUT; canvas.height = OUT;
    const ctx = canvas.getContext('2d');
    try{ ctx.drawImage(img, sx, sy, sSize, sSize, 0, 0, OUT, OUT); }catch(e){}
    const outUrl = canvas.toDataURL('image/jpeg', 0.72);
    cleanup();
    onDone(outUrl);
  };
}

async function loadPublicOthers(){
  const fresh = {};
  const keys = await slist('public-personal:', true);
  for(const k of keys){
    const name = k.slice('public-personal:'.length);
    const arr = await sget(k, true);
    if(arr) fresh[name] = arr;
  }
  publicOthers = fresh;
}

async function syncPublicPersonal(){
  const shared = personalItems
    .filter(x=> x.visibility==='public' || x.visibility==='half')
    .map(x=>{
      if(x.visibility==='public') return x;
      // half-public: only expose the busy time-slot, never title/location/notes/photos
      return { id:x.id, date:x.date, time:x.time, duration:x.duration, visibility:'half' };
    });
  await sset('public-personal:'+myName, shared, true);
  publicOthers[myName] = shared;
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  let lastShV = -1, lastStSig = '';
  const pollTick = async ()=>{
    if(dragCtx || document.hidden) return;
    if(DB){ await refreshShared(); if(sh.v===lastShV) return; lastShV = sh.v; renderMemberBar(); if(await adoptSharedAvatar(true)) renderApp();
      if(await followRename()){ await registerMe(); renderApp(); } }
    let dirty = false;
    const stSig = (sh.st||[]).map(m=>[m.id,m.owner,m.date,m.t,m.f,m.w,m.rot].join('|')).join(';') + '#' + Object.keys(sh.sti||{}).length;
    if(stSig!==lastStSig){ lastStSig = stSig; if(scope==='group') dirty = true; }
    const freshGroup = await sget('group-items', true);
    if(freshGroup && JSON.stringify(freshGroup) !== JSON.stringify(groupItems)){ groupItems = freshGroup; dirty = true; }
    const freshPl = await sget('plans', true);
    if(freshPl && JSON.stringify(freshPl) !== JSON.stringify(plans)){ plans = freshPl; dirty = true; }
    const freshBk = await sget('bookings', true);
    if(freshBk && JSON.stringify(freshBk) !== JSON.stringify(bookings)){ bookings = freshBk; if(scope==='bookings') dirty = true; }
    const freshX = await sget('expenses', true);
    if(freshX && JSON.stringify(freshX) !== JSON.stringify(expenses)){ expenses = freshX; if(scope==='expenses') dirty = true; }
    const freshCand = await sget('candidates', true);
    if(freshCand && JSON.stringify(freshCand) !== JSON.stringify(candidates)){ candidates = freshCand; dirty = true; }
    if(myName && Date.now() - _pWriteAt > 4000){
      const freshP = await sget('personal-items', false);
      if(freshP && JSON.stringify(freshP) !== JSON.stringify(personalItems)){ personalItems = freshP; if(scope==='personal') dirty = true; }
    }
    const freshTrip = await sget('trip-config', true);
    if(freshTrip && JSON.stringify(freshTrip) !== JSON.stringify(trip)){ trip = freshTrip; dirty = true; }
    if(dirty) renderApp();
  };
  pollTimer = setInterval(pollTick, 5000);
  setTimeout(pollTick, 600);   // 開頁後即刻同步一次（快取先出畫面，呢次補返最新）

  if(publicPollTimer) clearInterval(publicPollTimer);
  publicPollTimer = setInterval(async ()=>{
    await loadPublicOthers();
    if(scope==='group' || scope==='personal') renderApp();
  }, 20000);
}

/* ---------------- calendar panel (personal / group / compare) ---------------- */
function buildDayItems(mode, dateStr){
  cardRegistry = cardRegistry || {};
  const list = [];
  const R = layout==='rows';

  function pushPersonal(it, opts){
    const key = 'p:'+it.id+':'+(opts.ownerName||myName);
    const cfg = Object.assign({
      key, id: it.id, title: it.title, time: it.time, duration: it.duration,
      location: it.location, address: it.address, mapUrl: it.mapUrl, igUrl: it.igUrl, type: it.type, options: it.options, chosen: it.chosen, lat: it.lat, lng: it.lng, geoKey: it.geoKey, geoSrc: it.geoSrc, photos: it.photos||[], colorClass: 'personal',
      tag: it.tag||'', color: it.color||'',
      sourceType: 'personal', editable: false, showJoin: false, conflict: false,
      leftPct: 2, widthPct: 96, ownerTag: null
    }, opts);
    cardRegistry[key] = cfg;
    list.push(cfg);
  }
  function pushGroup(it, opts){
    const key = 'g:'+it.id;
    const cfg = Object.assign({
      key, id: it.id, title: it.title, time: it.time, duration: it.duration,
      location: it.location, address: it.address, mapUrl: it.mapUrl, igUrl: it.igUrl, type: it.type, options: it.options, chosen: it.chosen, lat: it.lat, lng: it.lng, geoKey: it.geoKey, geoSrc: it.geoSrc, photos: it.photos||[], colorClass: 'group',
      tag: it.tag||'', color: it.color||'',
      sourceType: 'group', editable: false, showJoin: false, conflict: false,
      leftPct: 2, widthPct: 96, ownerTag: it.owner, groupId: it.id
    }, opts);
    cardRegistry[key] = cfg;
    list.push(cfg);
  }

  if(mode==='personal'){
    personalItems.filter(x=>x.date===dateStr).forEach(it=>{
      pushPersonal(it, {editable:true, leftPct:2, widthPct: 50});
    });
    gVis().filter(x=>x.date===dateStr && (x.participants||[]).includes(myName)).forEach(it=>{
      pushGroup(it, {editable:false, showJoin:true, leftPct:54, widthPct:44, ownerTag:'已參加', ownerSmall:true, showWho:false});
    });
  }
  else if(mode==='group'){
    const sp = selPlans(), two = sp.length>1; const PL = two?66:(R?52:58), PW = two?33:(R?46:40);
    const gAll = gVis().filter(x=>x.date===dateStr); const gToday = gAll.filter(x=>planOf(x)===sp[0]);
    const pToday = personalItems.filter(x=>x.date===dateStr);
    gAll.forEach(it=>{ const k = sp.indexOf(planOf(it));
      pushGroup(it, {editable:true, showJoin:true, leftPct: two ? 1+k*32 : 2, widthPct: two ? 31 : (R?46:54), conflict: pToday.some(p=>overlaps(p,it)), colorClass: two ? 'group plan-'+(k?'b':'a') : 'group', ownerTag: two ? (it.owner||'')+' · '+planName(planOf(it)) : it.owner});
    });
    pToday.forEach(it=>{
      pushPersonal(it, {editable:true, leftPct:PL, widthPct:PW, ownerTag:'你的個人行程', conflict: gToday.some(g=>overlaps(g,it))});
    });
    Object.keys(publicOthers).filter(n=>n!==myName).forEach(name=>{
      (publicOthers[name]||[]).filter(x=>x.date===dateStr).forEach(it=>{
        const isHalf = it.visibility==='half';
        const label = (name===myName? '你' : name)+'的個人行程';
        const shown = isHalf ? Object.assign({}, it, {title:'（忙緊）', location:'', notes:'', photos:[], tag:'', color:''}) : it;
        pushPersonal(shown, {
          editable:false, leftPct:PL, widthPct:PW, ownerName:name,
          ownerTag: label,
          colorClass: isHalf ? 'other half' : 'other'
        });
      });
    });
  }
  else if(mode==='compare'){
    const mine = personalItems.filter(x=>x.date===dateStr).map(it=>({it}));
    const team = groupItems.filter(x=>x.date===dateStr && planOf(x)===selPlans()[0]).map(it=>({it}));
    mine.forEach(m=>{
      team.forEach(t=>{
        if(overlaps(m.it, t.it)){ m.conflict = true; t.conflict = true; }
      });
    });
    mine.forEach(m=>{
      pushPersonal(m.it, {editable:true, leftPct:3, widthPct:44, conflict:!!m.conflict});
    });
    team.forEach(t=>{
      pushGroup(t.it, {editable:false, leftPct:53, widthPct:44, conflict:!!t.conflict, ownerTag:t.it.owner});
    });
  }
  return list;
}


function readableOn(hex){
  const h = hex.replace('#','');
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  const lum = (0.299*r + 0.587*g + 0.114*b)/255;
  return lum > 0.62 ? '#40311F' : '#FFFFFF';
}

function itemCardHtml(cfg){
  const compact = (+cfg.duration||0) <= 90;
  const startM = timeToMins(cfg.time) - START_HOUR*60;
  const rows = layout==='rows';
  let posStyle, hpx = 999;
  if(rows){
    const left = Math.max(0, startM/60*ROWW);
    const width = Math.max(44, (cfg.duration/60)*ROWW - 3);
    posStyle = `left:${left}px; width:${width}px; top:${cfg.leftPct}%; height:${cfg.widthPct}%;`;
  } else {
    const top = Math.max(0, startM/60*ROW_H);
    const height = Math.max(32, (cfg.duration/60)*ROW_H - 3);
    hpx = height;
    posStyle = `top:${top}px; height:${height}px; left:${cfg.leftPct}%; width:${cfg.widthPct}%;`;
  }
  const photos = compact ? '' : (cfg.photos||[]).slice(0,3).map(p=>`<img src="${p}">`).join('');
  const ownerHtml = (cfg.ownerTag && !compact) ? `<div class="item-owner${cfg.ownerSmall?' sm':''}">${escapeHtml(cfg.ownerTag)}</div>` : '';
  const conflictHtml = cfg.conflict ? `<div class="conflict-badge">⚠ 撞期</div>` : '';
  const tagHtml = (cfg.tag && !compact) ? `<div class="item-tag">${escapeHtml(cfg.tag)}</div>` : '';
  const colorStyle = cfg.color ? `background:${cfg.color};color:${readableOn(cfg.color)};` : '';
  let joinHtml = '';
  if(cfg.showJoin){
    const it = groupItems.find(x=>x.id===cfg.groupId);
    const joined = it && (it.participants||[]).includes(myName);
    if(cfg.duration >= 45 && !(it && it.owner===myName)){
      joinHtml = `<button class="join-btn mini ${joined?'joined':''}" data-joinkey="${cfg.key}" title="${joined?'已參加（撳取消）':'我去'}">${joined? '✓' : '＋'}</button>`;
    }
  }
  let whoHtml = '';
  let joinedMe = false;
  if(cfg.groupId){
    const g0 = groupItems.find(x=>x.id===cfg.groupId);
    const ps = (g0 && g0.participants) || [];
    joinedMe = ps.includes(myName);
    if(ps.length && cfg.duration >= 120 && cfg.showWho!==false){
      const avs = {}; getMembers().forEach(m=>{ avs[m.name] = m.av; });
      const shown = ps.slice(0,6);
      whoHtml = `<div class="item-who" title="${escapeHtml(ps.join('、'))}">` +
        shown.map(n=>`<span title="${escapeHtml(n)}">${avs[n] ? `<img src="${avs[n]}" alt="">` : escapeHtml(Array.from(n)[0]||'?')}</span>`).join('') +
        (ps.length>shown.length ? `<em>+${ps.length-shown.length}</em>` : '') + `<b>${ps.length}人</b></div>`;
    }
  }
  const trCh = (cfg.type==='transit') ? trChosenOf(cfg) : null;
  const trN = (cfg.type==='transit' && cfg.options) ? cfg.options.length : 0;
  const trLine = cfg.type==='transit' ? `<div class="item-tr">${trCh ? trMode(trCh.mode).i + ' ' + escapeHtml(trCh.label || trMode(trCh.mode).l) + (trCh.mins ? ' · ' + (+trCh.mins) + '分' : '') : '🚌 未填方案'}${trN>1 ? ' ｜另有 ' + (trN-1) + ' 個方案' : ''}</div>` : '';
  const adjBtn = cfg.editable ? `<button type="button" class="adj-open" style="right:${cfg.showJoin?24:3}px" data-adjopen="${cfg.key}" title="調整時間">⏱</button>` : '';
  const resizeHtml = cfg.editable ? `<div class="resize-handle${rows?' h':''}" data-resize-key="${cfg.key}"><span></span></div>` : '';
  return `
    <div class="item-card ${adjustKey===cfg.key?'adjusting ':''}${compact?'compact ':''}${hpx<64?'short ':''}${compact&&+cfg.duration>=90?'tall ':''}${cfg.colorClass}${cfg.conflict?' conflict':''}${joinedMe?' joined-me':''}${cfg.type==='transit'?' transit':''}" draggable="${cfg.editable?'true':'false'}"
         data-key="${cfg.key}" data-editable="${cfg.editable?1:0}"
         style="${posStyle} ${colorStyle}">
      ${conflictHtml}
      ${ownerHtml}
      <div class="item-time">${cfg.time}–${endTimeStr(cfg.time,cfg.duration)}</div>
      <div class="item-title">${cfg.type==='transit' ? (trCh ? trMode(trCh.mode).i : '🚌') + ' ' : ''}${escapeHtml(cfg.title)}${(+cfg.duration<=45 && cfg.location) ? ` <span class="it-inl">📍${escapeHtml(cfg.location)}</span>` : ''}</div>
      ${trLine}

function stickersHtml(dateStr, dates){
  const rowsL = layout==='rows';
  const pick = (s)=> (dates.includes(s.date) ? s.date : dates[0]) === dateStr;
  const mk = (s, img, own)=>{
    const t = s.t==null ? 1 : s.t, f = s.f==null ? 0.05 : s.f;
    const pos = rowsL ? `left:${Math.round(t*ROWW)}px; top:${(f*100).toFixed(2)}%;` : `left:${(f*100).toFixed(2)}%; top:${Math.round(t*ROW_H)}px;`;
    const base = `${pos} width:${s.w||120}px; transform:rotate(${s.rot||0}deg);`;
    if(!own) return `<div class="sticker other" data-sid="${s.id}" data-own="0" style="${base} pointer-events:none;"><img src="${img}" draggable="false" alt=""></div>`;
    return `<div class="sticker${selectedSticker===s.id?' sel':''}" data-sid="${s.id}" data-own="1" style="${base}"><img src="${img}" draggable="false" alt=""><button type="button" class="st-del" title="刪除">✕</button><button type="button" class="st-rot" title="旋轉">↻</button><div class="st-resize"></div></div>`;
  };
  let html = stickers.filter(s=> pick(s) && stickerImgs[s.id]).map(s=> mk(s, stickerImgs[s.id], true)).join('');
  if(scope==='group'){
    html += (sh.st||[]).filter(s=> s.owner!==myName && sh.sti[s.id] && pick(s)).map(s=> mk(s, sh.sti[s.id], false)).join('');
  }
  return html;
}

function renderCalendarPanel(mode){
  const mount = document.getElementById('scope-content');
  if(!mount) return;
  cardRegistry = {};
  const dates = tripDates();
  const nH = END_HOUR-START_HOUR;
  const totalHeight = nH * ROW_H;
  const totalW = nH * ROWW;
  const rowsMode = layout==='rows';
  const bkMax = Math.max(0, ...dates.map(d=> bookingsOn(d).length));
  const bkShown = bkExpandAll ? (bkMax>3 ? bkMax+1 : bkMax) : Math.min(bkMax, 3 + (bkMax>3 ? 1 : 0));
  const headH = 64 + (bkMax ? bkShown*26 + 8 : 0);

  const dayFrags = dates.map((dateStr, idx)=>{
    const d = parseDate(dateStr);
    let linesHtml = '';
    if(rowsMode){
      for(let h=0; h<=nH; h++){
        linesHtml += `<div class="grid-line vline" style="left:${h*ROWW}px"></div>`;
        if(h<nH) linesHtml += `<div class="vlabel" style="left:${h*ROWW+3}px">${pad((START_HOUR+h)%24)}</div>`;

    }

  if(rowsMode){
    let hoursHtml = '';

    const rowDivider = mode==='compare'

      <div class="board-wrap-rows">
        <div class="rows-scroll"><div class="rows-board">
          <div class="rows-headrow"><div class="rows-corner"></div><div class="rows-hours" style="width:${totalW}px">${hoursHtml}</div></div>
          ${rowsHtml}
        </div></div>
        <div class="board-caption">${escapeHtml(trip.title)} · ${escapeHtml(myName)}</div>
        ${decoHtml()}
      </div>`;
  } else {
    let railHtml = `<div class="rail-head" ${bkMax ? `style="height:${headH}px"` : ''}></div>`;
    for(let h=START_HOUR; h<END_HOUR; h++){ railHtml += `<div class="time-slot-label" style="height:${ROW_H}px">${pad(h%24)}:00</div>`; }
    const dividerHtml = mode==='compare'
      ? `<div class="lane-divider"></div><div class="lane-caption" style="left:3%;">我</div><div class="lane-caption" style="left:53%;">小隊</div>`
      : '';

    let daysHtml = '';
    dayFrags.forEach(f=>{
      daysHtml += `
        <div class="day-col">
          <div class="day-head${bkMax?' has-book':''}" ${bkMax ? `style="height:${headH}px"` : ''}>${dayHeadInner(f)}${bkDayChipsHtml(f.dateStr)}</div>
          <div class="day-body" data-date="${f.dateStr}" style="height:${totalHeight}px;">
            ${f.linesHtml}
            ${mode==='compare'?dividerHtml:''}
            ${f.itemsHtml}
          </div>
        </div>`;
    });
    const desktopHtml = `
      <div class="board-wrap-desktop">
        <div class="board-scroll">
          <div class="board">
            <div class="time-rail">${railHtml}</div>
            ${daysHtml}
          </div>
        </div>
        <div class="board-caption">${escapeHtml(trip.title)} · ${escapeHtml(myName)}</div>
        ${decoHtml()}
      </div>`;

    const pillsHtml = dayFrags.map((f,i)=>`<button type="button" class="day-pill ${i===0?'active':''}" data-page="${i}"><span>DAY${f.idx+1}</span><span class="pdate">${f.d.getMonth()+1}/${f.d.getDate()}</span></button>`).join('');
    const pagesHtml = dayFrags.map(f=>`
      <div class="day-page" data-page-date="${f.dateStr}">
        <div class="day-page-head"><div class="d-title">DAY ${f.idx+1}</div><div class="d-sub">${f.d.getMonth()+1}/${f.d.getDate()} 週${DOW[f.d.getDay()]}</div></div>
        <div class="day-page-body">
          <div class="time-rail">${railHtml}</div>
          <div class="day-col">
            <div class="day-body" data-date="${f.dateStr}" style="height:${totalHeight}px;">
              ${f.linesHtml}
              ${mode==='compare'?dividerHtml:''}
              ${f.itemsHtml}
            </div>
          </div>
        </div>
      </div>`).join('');
    const mobileHtml = '';
    const _unusedMobile = `
      <div class="board-wrap-mobile">
        <div class="day-pills">${pillsHtml}</div>
        <div class="day-pager" id="day-pager">${pagesHtml}</div>
        <div class="swipe-cue">← 掃動可以睇下一日 →</div>
        <div class="board-caption">${escapeHtml(trip.title)} · ${escapeHtml(myName)}</div>
        ${decoHtml()}
      </div>`;

    mount.innerHTML = candidatesDrawerHtml(mode) + bookingsDrawerHtml(mode) + desktopHtml + mobileHtml;

    const pager = document.getElementById('day-pager');
    const pills = mount.querySelectorAll('.day-pill');
    pills.forEach(p=>{
      p.onclick = ()=>{
        const i = parseInt(p.dataset.page,10);
        const page = pager.children[i];
        if(page) pager.scrollTo({left: page.offsetLeft, behavior:'smooth'});
      };
    });
    if(pager){
      if(currentPageIdx >= dates.length) currentPageIdx = 0;
      if(currentPageIdx > 0 && pager.clientWidth){
        pager.scrollLeft = currentPageIdx * pager.clientWidth;
        pills.forEach((p,i)=> p.classList.toggle('active', i===currentPageIdx));
      }
      let scrollTick = null;
      pager.addEventListener('scroll', ()=>{
        if(scrollTick) return;
        scrollTick = requestAnimationFrame(()=>{
          scrollTick = null;
          const idx = Math.round(pager.scrollLeft / pager.clientWidth);
          currentPageIdx = idx;
          pills.forEach((p,i)=> p.classList.toggle('active', i===idx));
        });
      });
    }
  }

  wireCalendarInteractions(mode);
  wireCandidatesDrawer(mode);
  wireBookingsUI(mode);
  wireResizeHandles(mode);
  wireStickers(mount);
}
